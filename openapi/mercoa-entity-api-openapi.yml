    paymentMethodTypes_BankAccountCheckOptions:
      type: object
      properties:
        enabled:
          type: boolean
          description: If true, will allow the user to print checks from this bank account
        initialCheckNumber:
          type: integer
          description: If provided, will start the check number sequence at the provided number. If not provided, will start at 5000.
        routingNumberOverride:
          type: string
          description: If provided, will print a check with the provided routing number instead of the one from the bank account
        accountNumberOverride:
          type: string
          description: If provided, will print a check with the provided account number instead of the one from the bank account
        accountHolderNameOverride:
          type: string
          description: If provided, will print a check with the provided account holder name instead of the payer name from the invoice
        accountHolderAddressOverride:
          $ref: '#/components/schemas/commons_Address'
          description: If provided, will print a check with the provided account holder address instead of the payer address from the invoice
        signatoryName:
          type: string
          description: Name of the person who's signature will be printed on the check.
        signatureImage:
          type: string
          description: Base64 encoded image of the signature. If not provided, will use the signatoryName to generate a signature. Mercoa will automatically grayscale, resize, and convert the image to a PNG the image to fit on the check.
        useSignatureImage:
          type: boolean
          description: If true, will print checks with the provided signatureImage. If false, will print checks with a generated signature from the signatoryName. If this parameter is not set the default behavior is to use the signatureImage if provided.
      required:
      - signatoryName
      title: BankAccountCheckOptions
