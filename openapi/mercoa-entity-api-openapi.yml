          description: The ID of the event
        data:
          $ref: '#/components/schemas/entityTypes_EntityResponse'
          description: The payment method data at the time of the event
        webhookIds:
          type: array
          items:
            type: string
          description: The list of webhook IDs associated with this event
        userId:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
          description: The ID of the user who triggered the event
        updatedByEntityId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: The ID of the entity that updated the payment method
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the event was created
      required:
      - id
      - data
      - webhookIds
      - createdAt
      title: EntityEvent
    paymentMethodTypes_CustomPaymentMethodSchemaField:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        type:
          $ref: '#/components/schemas/paymentMethodTypes_CustomPaymentMethodSchemaFieldType'
        optional:
          type: boolean
          description: Indicates whether this field is optional
        useAsAccountName:
          type: boolean
          description: Indicates whether this field should be used as the name of the payment method. Only one field can be used as the name. Will set the accountName field of the payment method to the value of this field.
        useAsAccountNumber:
          type: boolean
          description: Indicates whether this field should be used as the account number of the payment method. Only one field can be used as the account number. Will set the accountNumber field of the payment method to the value of this field.
        options:
          type: array
          items:
            type: string
          description: When type is 'select', provide options that can be selected
      required:
      - name
      - type
      - optional
      title: CustomPaymentMethodSchemaField
    entityTypes_TokenGenerationStyleOptions:
      type: object
      properties:
        primaryColor:
          type: string
      required:
      - primaryColor
      title: TokenGenerationStyleOptions
    paymentMethodTypes_CardType:
      type: string
      enum:
      - credit
      - debit
      - prepaid
      - unknown
      title: CardType
    paymentMethodTypes_CardBrand:
      type: string
      enum:
      - AmericanExpress
      - Discover
      - Mastercard
      - Visa
      title: CardBrand
    entityTypes_IndividualProfileResponse:
      type: object
      properties:
        email:
          type: string
        name:
          $ref: '#/components/schemas/commons_FullName'
        phone:
          $ref: '#/components/schemas/commons_PhoneNumber'
        address:
          $ref: '#/components/schemas/commons_Address'
        birthDateProvided:
          type: boolean
        governmentIDProvided:
          type: boolean
      required:
      - name
      - birthDateProvided
      - governmentIDProvided
      title: IndividualProfileResponse
    entityTypes_EntityCreationRequest:
      type: object
      properties:
        foreignId:
          type: string
          description: The ID used to identify this entity in your system. This ID must be unique across all entities in your system.
        emailTo:
          type: string
          description: Sets the email address to which to send invoices to be added to the Invoice Inbox. Only provide the local-part/username of the email address, do not include the @domain.com
        emailToAlias:
          type: array
          items:
            type: string
          description: Email inbox alias addresses. Used when forwarding emails to the emailTo address from an alias. Include the full email address.
        isCustomer:
          type: boolean
          description: If this entity has a direct relationship with your organization (e.g your direct customer or client), set this to true. Otherwise, set to false (e.g your customer's vendors).
        accountType:
          $ref: '#/components/schemas/entityTypes_AccountType'
        profile:
          $ref: '#/components/schemas/entityTypes_ProfileRequest'
        isPayor:
          type: boolean
          description: If this entity will be paying invoices, set this to true.
        isPayee:
          type: boolean
          description: If this entity will be receiving payments, set this to true.
        isNetworkPayor:
          type: boolean
          description: Control if this entity should be available as a payor to any entity on your platform. If set to false, this entity will only be available as a payor to entities that have a direct relationship with this entity. Defaults to false.
        isNetworkPayee:
          type: boolean
          description: Control if this entity should be available as a payee to any entity on your platform. If set to false, this entity will only be available as a payee to entities that have a direct relationship with this entity. Defaults to false.
        logo:
          type: string
          description: Base64 data URL of the entity logo. Must be in the `data:image/*;base64,XXXX` format. We recommend a PNG image under 100KB. Supported file types are `png`, `jpeg`, `gif`, `svg`.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Simple key/value metadata associated with this entity. For more complex metadata, use the Metadata API.
      required:
