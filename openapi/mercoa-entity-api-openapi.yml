openapi: 3.2.0
info:
  title: Reference Entity API
  version: 1.0.0
servers:
- url: https://api.mercoa.com
  description: Production
tags:
- name: Entity
paths:
  /entity:
    get:
      operationId: entity_find
      summary: Search entities
      description: Search all entities with the given filters. If no filters are provided, all entities will be returned.
      tags:
      - Entity
      parameters:
      - name: paymentMethods
        in: query
        description: If true, will include entity payment methods as part of the response
        required: false
        schema:
          type: boolean
      - name: isCustomer
        in: query
        description: If true, only entities with a direct relationship to the requesting organization will be returned. If false or not provided, all entities will be returned.
        required: false
        schema:
          type: boolean
      - name: foreignId
        in: query
        description: ID used to identify this entity in your system
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityStatus'
      - name: isPayee
        in: query
        description: 'If true, entities that are marked as payees will be returned.

          If false or not provided, entities that are marked as payees will not be returned.'
        required: false
        schema:
          type: boolean
      - name: isPayor
        in: query
        description: 'If true or not provided, entities that are marked as payors will be returned.

          If false, entities that are marked as payors will not be returned.'
        required: false
        schema:
          type: boolean
      - name: name
        in: query
        description: Use search instead. Deprecated. Filter entities by name. Partial matches are supported.
        required: false
        schema:
          type: string
        deprecated: true
      - name: search
        in: query
        description: Find entities by name, email, emailTo, entity ID, or foreign ID. Partial matches are supported for name, email, and emailTo. Exact matches are used for entity ID and foreign ID.
        required: false
        schema:
          type: string
      - name: metadata
        in: query
        description: Filter entities by simple key/value metadata. Each filter will be applied as an AND condition. Duplicate keys will be ignored.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_MetadataFilter'
      - name: returnMetadata
        in: query
        description: Return simple key/value metadata for the specified keys for the entities. For more complex metadata, use the Metadata API.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of entities to return. Limit can range between 1 and 100, and the default is 10.
        required: false
        schema:
          type: integer
      - name: startingAfter
        in: query
        description: The ID of the entity to start after. If not provided, the first page of entities will be returned.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entityTypes_FindEntityResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
