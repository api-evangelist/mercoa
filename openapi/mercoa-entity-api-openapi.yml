  /entity/{entityId}/onboarding:
    get:
      operationId: entity_getOnboardingLink
      summary: Generate Onboarding Link
      description: Generate an onboarding link for the entity.
      tags:
      - Entity
      parameters:
      - name: entityId
        in: path
        description: Entity ID or Entity ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: type
        in: query
        description: The type of onboarding link to generate. If not provided, the default is payee. The onboarding options are determined by your organization's onboarding configuration.
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityOnboardingLinkType'
      - name: expiresIn
        in: query
        description: Expressed in seconds or a string describing a time span. The default is 24h.
        required: false
        schema:
          type: string
      - name: connectedEntityId
        in: query
        description: The ID of the entity to connect to. If onboarding a payee, this should be the payor entity ID. If onboarding a payor, this should be the payee entity ID. If no connected entity ID is provided, the onboarding link will be for a standalone entity.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: redirectToPortal
        in: query
        description: If true, the onboarding link will redirect to the vendor/customer portal if the entity is already onboarded. If false, the onboarding link will not redirect to the portal. The default is false.
        required: false
        schema:
          type: boolean
      - name: vendorPortalOptions
        in: query
        description: The options for the vendor portal.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_VendorPortalOptions'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
