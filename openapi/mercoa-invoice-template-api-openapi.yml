components:
  schemas:
    invoiceTypes_PaymentScheduleEndCondition:
      oneOf:
      - type: integer
      - type: string
        format: date-time
      title: PaymentScheduleEndCondition
    invoiceTypes_InvoiceFeesRequest:
      type: object
      properties:
        sourcePlatformMarkupFee:
          type: number
          format: double
          description: Fee charged to the payer (C2).
        destinationPlatformMarkupFee:
          type: number
          format: double
          description: Fee charged to the payee (C3).
      required:
      - sourcePlatformMarkupFee
      - destinationPlatformMarkupFee
      title: InvoiceFeesRequest
    invoiceTypes_InvoiceLineItemCreationRequest:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          description: Currency code for the amount. Defaults to USD.
        name:
          type: string
        quantity:
          type: number
          format: double
        unitPrice:
          type: number
          format: double
          description: Unit price of the line item in major units. If the entered amount has more decimal places than the currency supports, trailing decimals will be truncated.
        category:
          type: string
          description: Category of the line item.
        serviceStartDate:
          type: string
          format: date-time
        serviceEndDate:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
        glAccountId:
          type: string
          description: ID of general ledger account associated with this line item.
        amount:
          type: number
          format: double
          description: Total amount of line item in major units. If the entered amount has more decimal places than the currency supports, trailing decimals will be truncated.
        description:
          type: string
      title: InvoiceLineItemCreationRequest
    entityTypes_CounterpartyNetworkType:
      type: string
      enum:
      - ENTITY
      - NETWORK
      title: CounterpartyNetworkType
    entityTypes_ApprovalPolicyId:
      type: string
      title: ApprovalPolicyId
    entityTypes_TaxID:
      type: object
      properties:
        ein:
          $ref: '#/components/schemas/entityTypes_Ein'
      required:
      - ein
      title: TaxID
    paymentMethodTypes_CustomPaymentMethodSchemaField:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        type:
          $ref: '#/components/schemas/paymentMethodTypes_CustomPaymentMethodSchemaFieldType'
        optional:
          type: boolean
          description: Indicates whether this field is optional
        useAsAccountName:
          type: boolean
          description: Indicates whether this field should be used as the name of the payment method. Only one field can be used as the name. Will set the accountName field of the payment method to the value of this field.
        useAsAccountNumber:
          type: boolean
          description: Indicates whether this field should be used as the account number of the payment method. Only one field can be used as the account number. Will set the accountNumber field of the payment method to the value of this field.
        options:
          type: array
          items:
            type: string
          description: When type is 'select', provide options that can be selected
      required:
      - name
      - type
      - optional
      title: CustomPaymentMethodSchemaField
    invoiceTypes_PaymentDestinationOptions:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - check
            description: 'Discriminator value: check'
          delivery:
            $ref: '#/components/schemas/invoiceTypes_CheckDeliveryMethod'
            description: Delivery method for check disbursements. Defaults to MAIL.
          printDescription:
            type: boolean
            description: If true, prints the invoice description (noteToSelf) on the check note. Defaults to false.
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - bankAccount
            description: 'Discriminator value: bankAccount'
          delivery:
            $ref: '#/components/schemas/invoiceTypes_BankDeliveryMethod'
            description: Delivery method for ACH payments. Defaults to ACH_SAME_DAY.
          description:
            type: string
            description: 'ACH Statement Description.

              By default, this will be ''AP'' followed by the first 8 characters of the invoice ID (for a single invoice) or the first 8 characters of the transaction ID (for a batch payment).

              Must be at least 4 characters and no more than 10 characters, and follow this regex pattern `^[a-zA-Z0-9\-#.$&* ]{4,10}$`'
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - utility
            description: 'Discriminator value: utility'
          accountId:
            type: string
            description: The ID for the utility account to pay with. Links to accounts listed on payor/payee relationship.
        required:
        - type
        - accountId
      - type: object
        properties:
          type:
            type: string
            enum:
            - custom
            description: 'Discriminator value: custom'
          dynamicUrls:
            type: object
            additionalProperties:
              type: string
            description: Map of field names to dynamic URL values that will be used for dynamicUrl fields in custom payment method schemas
        required:
        - type
      discriminator:
        propertyName: type
      title: PaymentDestinationOptions
    paymentMethodTypes_CardType:
      type: string
      enum:
      - credit
      - debit
      - prepaid
      - unknown
      title: CardType
    paymentMethodTypes_CardBrand:
      type: string
      enum:
      - AmericanExpress
      - Discover
      - Mastercard
      - Visa
      title: CardBrand
    entityTypes_IndividualProfileResponse:
      type: object
      properties:
        email:
          type: string
        name:
          $ref: '#/components/schemas/commons_FullName'
        phone:
          $ref: '#/components/schemas/commons_PhoneNumber'
        address:
          $ref: '#/components/schemas/commons_Address'
        birthDateProvided:
          type: boolean
        governmentIDProvided:
          type: boolean
      required:
      - name
      - birthDateProvided
      - governmentIDProvided
      title: IndividualProfileResponse
    commons_OrderDirection:
      type: string
      enum:
      - ASC
      - DESC
      title: OrderDirection
    entityTypes_EntityUserId:
      type: string
      title: EntityUserId
    paymentMethodTypes_BankStatus:
      type: string
      enum:
      - NEW
      - VERIFIED
      - VERIFICATION_FAILED
      - PENDING
      - ERRORED
      title: BankStatus
    entityTypes_CounterpartyCustomizationAccount:
      type: object
      properties:
        accountId:
          type: string
          description: The ID the counterparty has assigned to this account.
        postalCode:
          type: string
          description: The postal code the counterparty has assigned to this account.
        nameOnAccount:
          type: string
          description: The name on the account the counterparty has assigned to this account.
      required:
      - accountId
      title: CounterpartyCustomizationAccount
    entityTypes_EntityId:
      type: string
      title: EntityId
    invoiceTypes_ApprovalSlot:
      type: object
      properties:
        upstreamPolicyId:
          $ref: '#/components/schemas/entityTypes_ApprovalPolicyId'
          description: The identifier for the upstream policy this slot is associated with.
        upstreamPoliciesApproved:
          type: boolean
          description: Whether all upstream policies are approved.
        approvalPolicyId:
          $ref: '#/components/schemas/entityTypes_ApprovalPolicyId'
          description: The identifier for the approval policy this slot is associated with.
        approvalSlotId:
          $ref: '#/components/schemas/invoiceTypes_ApprovalSlotId'
          description: The identifier for this approval slot
        assignedUserId:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
          description: The ID of the user who is assigned to the approval slot. If undefined, the approval slot is assigned to all eligible approvers.
        action:
          $ref: '#/components/schemas/invoiceTypes_ApproverAction'
        eligibleRoles:
          type: array
          items:
            type: string
        eligibleUserIds:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityUserId'
        date:
          type: string
          format: date-time
          description: Either the date the invoice was created, date the approver was assigned, or date of last action by approver, whichever is latest.
      required:
      - approvalPolicyId
      - approvalSlotId
      - action
      - eligibleRoles
      - eligibleUserIds
      - date
      title: ApprovalSlot
    entityTypes_ApprovalPolicyResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/entityTypes_ApprovalPolicyId'
        trigger:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_Trigger'
        rule:
          $ref: '#/components/schemas/entityTypes_Rule'
        upstreamPolicyId:
          $ref: '#/components/schemas/entityTypes_ApprovalPolicyId'
