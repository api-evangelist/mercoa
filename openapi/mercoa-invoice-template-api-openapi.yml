openapi: 3.2.0
info:
  title: Reference Invoice Template API
  version: 1.0.0
servers:
- url: https://api.mercoa.com
  description: Production
tags:
- name: invoice-template
paths:
  /invoice-templates:
    get:
      operationId: invoiceTemplate_find
      summary: Search invoice templates
      description: Search invoice templates for all entities in the organization
      tags:
      - invoice-template
      parameters:
      - name: entityId
        in: query
        description: Filter invoice templates by the ID or foreign ID of the entity that is the payer or the vendor of the invoice template.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: startDate
        in: query
        description: Start date filter. Defaults to CREATED_AT unless specified the dateType is specified
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: End date filter. Defaults to CREATED_AT unless specified the dateType is specified
        required: false
        schema:
          type: string
          format: date-time
      - name: dateType
        in: query
        description: Type of date to filter by if startDate and endDate filters are provided. Defaults to CREATED_AT.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceDateFilter'
      - name: orderBy
        in: query
        description: Field to order invoice templates by. Defaults to CREATED_AT.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceOrderByField'
      - name: orderDirection
        in: query
        description: Direction to order invoice templates by. Defaults to asc.
        required: false
        schema:
          $ref: '#/components/schemas/commons_OrderDirection'
      - name: limit
        in: query
        description: Number of invoice templates to return. Limit can range between 1 and 100, and the default is 10.
        required: false
        schema:
          type: integer
      - name: startingAfter
        in: query
        description: The ID of the invoice template to start after. If not provided, the first page of invoice templates will be returned.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceTemplateId'
      - name: search
        in: query
        description: Find invoice templates by vendor name, check number, invoice number, or amount. Partial matches are supported.
        required: false
        schema:
          type: string
      - name: metadata
        in: query
        description: Filter invoice templates by metadata. Each filter will be applied as an AND condition. Duplicate keys will be ignored.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_MetadataFilter'
      - name: lineItemMetadata
        in: query
        description: Filter invoice templates by line item metadata. Each filter will be applied as an AND condition. Duplicate keys will be ignored.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_MetadataFilter'
      - name: lineItemGlAccountId
        in: query
        description: Filter invoice templates by line item GL account ID. Each filter will be applied as an OR condition. Duplicate keys will be ignored.
        required: false
        schema:
          type: string
      - name: payerId
        in: query
        description: Filter invoice templates by payer ID or payer foreign ID.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: vendorId
        in: query
        description: Filter invoice templates by vendor ID or vendor foreign ID.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: creatorUserId
        in: query
        description: Filter invoices by the ID or foreign ID of the user that created the invoice.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
      - name: approverId
        in: query
        description: Filter invoice templates by assigned approver user ID.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
      - name: approverAction
        in: query
        description: Filter invoice templates by approver action. Needs to be used with approverId. For example, if you want to find all invoice templates that have been approved by a specific user, you would use approverId and approverAction=APPROVE.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_ApproverAction'
      - name: invoiceId
        in: query
        description: Filter invoice templates by invoice ID.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceId'
      - name: status
        in: query
        description: Invoice status to filter on
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceStatus'
      - name: paymentType
        in: query
        description: Filter invoice templates by recurring status
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/invoiceTypes_PaymentType'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoiceTypes_FindInvoiceTemplateResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      security:
      - default: []
