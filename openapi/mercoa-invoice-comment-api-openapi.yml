components:
  schemas:
    invoiceTypes_CommentResponse:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        user:
          $ref: '#/components/schemas/entityTypes_EntityUserResponse'
        associatedApprovalAction:
          $ref: '#/components/schemas/invoiceTypes_AssociatedApprovalAction'
          description: If an approval action has triggered the generation of this comment, returns the associated approval action and actor
