components:
  schemas:
    entity_externalAccountingSystem_externalAccountingSystemCompanyCreationRequest:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - codat
            description: 'Discriminator value: codat'
          companyId:
            type: string
            description: If the company already exists in Codat, provide the company ID to link the company to the entity. If the company does not exist, leave this field blank and Codat will create a new company.
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - rutter
            description: 'Discriminator value: rutter'
          accessToken:
            type: string
            description: The access token for the existing Rutter connection. If the connection does not exist, leave this field blank and Rutter will create a new connection.
        required:
        - type
      discriminator:
        propertyName: type
      title: externalAccountingSystemCompanyCreationRequest
    entityTypes_EntityId:
      type: string
      title: EntityId
    entity_externalAccountingSystem_syncType:
      type: string
      enum:
      - none
      - push
      - pull
      - both
      title: syncType
    entity_externalAccountingSystem_externalAccountingSystemCompanyResponse:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - codat
            description: 'Discriminator value: codat'
          companyId:
            type: string
        required:
        - type
        - companyId
      - type: object
        properties:
          type:
            type: string
            enum:
            - rutter
            description: 'Discriminator value: rutter'
          accessToken:
            type: string
        required:
        - type
        - accessToken
      - type: object
        properties:
          type:
            type: string
            enum:
            - none
            description: 'Discriminator value: none'
          companyId:
            type: string
        required:
        - type
        - companyId
      discriminator:
        propertyName: type
      title: externalAccountingSystemCompanyResponse
  securitySchemes:
    default:
      type: http
      scheme: bearer
