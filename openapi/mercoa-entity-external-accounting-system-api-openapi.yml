  /entity/{entityId}/external-accounting-system/sync:
    get:
      operationId: entity_externalAccountingSystem_sync
      summary: Sync External System
      description: Sync an entity with an external accounting system. Will sync customers/vendors and invoices.
      tags:
      - entity > external-accounting-system
      parameters:
      - name: entityId
        in: path
        description: Entity ID or Entity ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: vendors
        in: query
        description: Sync vendors from external accounting system. Default is to pull vendors from external system.
        required: false
        schema:
          $ref: '#/components/schemas/entity_externalAccountingSystem_syncType'
      - name: bills
        in: query
        description: Sync bills from external accounting system. Default is to not sync bills. Invoices that already exist in both systems will not be updated, only new invoices not present in the other system will be created.
        required: false
        schema:
          $ref: '#/components/schemas/entity_externalAccountingSystem_syncType'
      - name: glAccounts
        in: query
        description: Sync GL accounts from external accounting system. Default is to pull GL accounts from external system. Pushing GL accounts is not supported.
        required: false
        schema:
          $ref: '#/components/schemas/entity_externalAccountingSystem_syncType'
