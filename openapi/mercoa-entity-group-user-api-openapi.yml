components:
  schemas:
    entityTypes_VendorNetwork:
      type: string
      enum:
      - all
      - platform
      - entity
      title: VendorNetwork
    entityGroupTypes_EntityGroupUserResponse:
      type: object
      properties:
        foreignId:
          type: string
          description: The ID used to identify this user in your system.
        email:
          type: string
        name:
          type: string
        entities:
          type: array
          items:
            $ref: '#/components/schemas/entityGroupTypes_EntityGroupUserEntityResponse'
          description: List of roles per entity.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - foreignId
      - entities
      - createdAt
      - updatedAt
      title: EntityGroupUserResponse
    entityTypes_TokenGenerationPagesOptions:
      type: object
      properties:
        paymentMethods:
          type: boolean
        representatives:
          type: boolean
        notifications:
          type: boolean
        counterparties:
          type: boolean
        approvals:
          type: boolean
        emailLog:
          type: boolean
      title: TokenGenerationPagesOptions
    entityGroupTypes_EntityGroupUserRequest:
      type: object
      properties:
        foreignId:
          type: string
          description: The ID used to identify this user in your system. This is a required field and needs to be unique for all users in the group.
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
          description: 'List of roles to assign to the user. A role can be any string. For example: "payer", "approver", "viewer"

            If not provided, the user will have no roles. Per entity roles will override these global roles.'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/entityGroupTypes_EntityGroupUserEntityRequest'
          description: List of roles per entity. Useful for assigning roles to specific entities.
      required:
      - foreignId
      title: EntityGroupUserRequest
    entityGroupTypes_FindEntityGroupUserResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total number of users for the given filters. This value is not limited by the limit parameter. It is provided so that you can determine how many pages of results are available.
        hasMore:
          type: boolean
          description: True if there are more users available for the given filters.
        data:
          type: array
          items:
            $ref: '#/components/schemas/entityGroupTypes_EntityGroupUserResponse'
      required:
      - count
      - hasMore
      - data
      title: FindEntityGroupUserResponse
    invoiceTypes_InvoiceStatus:
      type: string
      enum:
      - UNASSIGNED
      - DRAFT
      - NEW
      - APPROVED
      - SCHEDULED
      - PENDING
      - PAID
      - ARCHIVED
      - REFUSED
      - CANCELED
      - FAILED
      title: InvoiceStatus
    entityGroupTypes_EntityGroupUserEntityResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
          description: 'List of roles. A role can be any string. For example: "payer", "approver", "viewer"'
        entityId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: The IDs of the entities that these roles applies to.
        id:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
      required:
      - roles
      - entityId
      - id
      title: EntityGroupUserEntityResponse
    entityGroupTypes_EntityGroupId:
      type: string
      title: EntityGroupId
    entityGroupTypes_EntityGroupUserEntityRequest:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
          description: 'List of roles. A role can be any string. For example: "payer", "approver", "viewer"'
        entityId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: The IDs of the entities that these roles applies to.
      required:
      - roles
      - entityId
      title: EntityGroupUserEntityRequest
    entityTypes_TokenGenerationStyleOptions:
      type: object
      properties:
        primaryColor:
          type: string
      required:
      - primaryColor
      title: TokenGenerationStyleOptions
    entityGroupTypes_EntityGroupUserSyncRequest:
      type: object
      properties:
        copyUsersFrom:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: "Entity ID / foreign ID of an entity currently in the group to copy users and roles from. \nIf not provided, users will be synced from the entity with the most users that has been updated most recently."
        filterRoles:
          type: array
