components:
  schemas:
    webhooks_InvoiceWebhook:
      type: object
      properties:
        eventType:
          type: string
          description: The type of the event.
        invoice:
          $ref: '#/components/schemas/invoiceTypes_InvoiceResponse'
          description: The invoice involved in the event.
        user:
          $ref: '#/components/schemas/entityTypes_EntityUserResponse'
          description: User who initiated the change.
      required:
      - eventType
      - invoice
      title: InvoiceWebhook
    transaction_TransactionResponse:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - bankAccountToBankAccount
            description: 'Discriminator value: bankAccountToBankAccount'
          id:
            $ref: '#/components/schemas/transaction_TransactionId'
          status:
            $ref: '#/components/schemas/transaction_TransactionStatus'
          amount:
            type: number
            format: double
          currency:
            type: string
          payerId:
            $ref: '#/components/schemas/entityTypes_EntityId'
          payer:
            $ref: '#/components/schemas/entityTypes_CounterpartyResponse'
          paymentSource:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodResponse'
          paymentSourceId:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          vendorId:
            $ref: '#/components/schemas/entityTypes_EntityId'
          vendor:
            $ref: '#/components/schemas/entityTypes_CounterpartyResponse'
          paymentDestination:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodResponse'
          paymentDestinationId:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          paymentDestinationOptions:
            $ref: '#/components/schemas/invoiceTypes_PaymentDestinationOptions'
          fees:
            $ref: '#/components/schemas/invoiceTypes_InvoiceFeesResponse'
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          failureReason:
            $ref: '#/components/schemas/transaction_TransactionFailureReason'
            description: If the invoice failed to be paid, this field will be populated with the reason of failure.
          invoices:
            type: array
            items:
              $ref: '#/components/schemas/invoiceTypes_InvoiceResponse'
            description: Invoices associated with this transaction
        required:
        - type
        - id
        - status
        - amount
        - currency
        - payerId
        - payer
        - paymentSource
        - paymentSourceId
        - vendorId
        - vendor
        - paymentDestination
        - paymentDestinationId
        - createdAt
        - updatedAt
        - invoices
      - type: object
        properties:
          type:
            type: string
            enum:
            - bankAccountToMailedCheck
            description: 'Discriminator value: bankAccountToMailedCheck'
          id:
            $ref: '#/components/schemas/transaction_TransactionId'
          status:
            $ref: '#/components/schemas/transaction_TransactionStatus'
          amount:
            type: number
            format: double
          currency:
            type: string
          payerId:
            $ref: '#/components/schemas/entityTypes_EntityId'
          payer:
            $ref: '#/components/schemas/entityTypes_CounterpartyResponse'
          paymentSource:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodResponse'
          paymentSourceId:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          vendorId:
            $ref: '#/components/schemas/entityTypes_EntityId'
          vendor:
            $ref: '#/components/schemas/entityTypes_CounterpartyResponse'
          paymentDestination:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodResponse'
          paymentDestinationId:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          paymentDestinationOptions:
            $ref: '#/components/schemas/invoiceTypes_PaymentDestinationOptions'
          fees:
            $ref: '#/components/schemas/invoiceTypes_InvoiceFeesResponse'
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          checkNumber:
            type: integer
            description: The number of the check
          mailedOnDate:
            type: string
            format: date-time
            description: The date the check was mailed. If the check was not mailed, this field will be null.
          invoices:
            type: array
            items:
              $ref: '#/components/schemas/invoiceTypes_InvoiceResponse'
            description: Invoices associated with this transaction
        required:
        - type
        - id
        - status
        - amount
        - currency
        - payerId
        - payer
        - paymentSource
        - paymentSourceId
        - vendorId
        - vendor
        - paymentDestination
        - paymentDestinationId
        - createdAt
        - updatedAt
        - checkNumber
        - invoices
      - type: object
        properties:
          type:
            type: string
            enum:
            - bankAccountToPrintedCheck
            description: 'Discriminator value: bankAccountToPrintedCheck'
          id:
            $ref: '#/components/schemas/transaction_TransactionId'
          status:
            $ref: '#/components/schemas/transaction_TransactionStatus'
          amount:
            type: number
            format: double
          currency:
            type: string
          payerId:
            $ref: '#/components/schemas/entityTypes_EntityId'
          payer:
            $ref: '#/components/schemas/entityTypes_CounterpartyResponse'
          paymentSource:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodResponse'
          paymentSourceId:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          vendorId:
            $ref: '#/components/schemas/entityTypes_EntityId'
          vendor:
            $ref: '#/components/schemas/entityTypes_CounterpartyResponse'
          paymentDestination:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodResponse'
          paymentDestinationId:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          paymentDestinationOptions:
            $ref: '#/components/schemas/invoiceTypes_PaymentDestinationOptions'
          fees:
            $ref: '#/components/schemas/invoiceTypes_InvoiceFeesResponse'
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          checkNumber:
            type: integer
            description: The number of the check
          invoices:
            type: array
            items:
              $ref: '#/components/schemas/invoiceTypes_InvoiceResponse'
            description: Invoices associated with this transaction
        required:
        - type
