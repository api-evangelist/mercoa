openapi: 3.2.0
info:
  title: Reference entity > payment-method > bank-account API
  version: 1.0.0
servers:
- url: https://api.mercoa.com
  description: Production
tags:
- name: entity > payment-method > bank-account
paths:
  /entity/{entityId}/paymentMethod/{paymentMethodId}/micro-deposits:
    post:
      operationId: entity_paymentMethod_bankAccount_initiateMicroDeposits
      summary: Initiate micro deposits
      description: Initiate micro deposits for a bank account
      tags:
      - entity > payment-method > bank-account
      parameters:
      - name: entityId
        in: path
        description: Entity ID or Entity ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: paymentMethodId
        in: path
        description: Payment Method ID or Payment Method ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      security:
      - default: []
    put:
      operationId: entity_paymentMethod_bankAccount_completeMicroDeposits
      summary: Verify micro deposits
      description: Complete micro deposit verification
      tags:
      - entity > payment-method > bank-account
      parameters:
      - name: entityId
        in: path
        description: Entity ID or Entity ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: paymentMethodId
        in: path
        description: Payment Method ID or Payment Method ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amounts:
                  type: array
                  items:
                    type: integer
                  description: The amounts of the micro deposits in cents
              required:
              - amounts
      security:
      - default: []
components:
  schemas:
    commons_Address:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        stateOrProvince:
          type: string
          description: State or province code. Must be in the format XX.
        postalCode:
          type: string
          description: Postal code. Must be in the format XXXXX or XXXXX-XXXX.
        country:
          type: string
      required:
      - addressLine1
      - city
      - stateOrProvince
      - postalCode
      title: Address
    paymentMethodTypes_CustomPaymentMethodSchemaId:
      type: string
      title: CustomPaymentMethodSchemaId
    paymentMethodTypes_CustomPaymentMethodSchemaField:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        type:
          $ref: '#/components/schemas/paymentMethodTypes_CustomPaymentMethodSchemaFieldType'
        optional:
          type: boolean
          description: Indicates whether this field is optional
        useAsAccountName:
          type: boolean
          description: Indicates whether this field should be used as the name of the payment method. Only one field can be used as the name. Will set the accountName field of the payment method to the value of this field.
        useAsAccountNumber:
          type: boolean
          description: Indicates whether this field should be used as the account number of the payment method. Only one field can be used as the account number. Will set the accountNumber field of the payment method to the value of this field.
        options:
          type: array
          items:
            type: string
          description: When type is 'select', provide options that can be selected
      required:
      - name
      - type
      - optional
      title: CustomPaymentMethodSchemaField
    paymentMethodTypes_CardBrand:
      type: string
      enum:
      - AmericanExpress
      - Discover
      - Mastercard
      - Visa
      title: CardBrand
    paymentMethodTypes_BankAccountCheckOptions:
      type: object
      properties:
        enabled:
          type: boolean
          description: If true, will allow the user to print checks from this bank account
        initialCheckNumber:
          type: integer
          description: If provided, will start the check number sequence at the provided number. If not provided, will start at 5000.
        routingNumberOverride:
          type: string
          description: If provided, will print a check with the provided routing number instead of the one from the bank account
        accountNumberOverride:
          type: string
          description: If provided, will print a check with the provided account number instead of the one from the bank account
        accountHolderNameOverride:
          type: string
          description: If provided, will print a check with the provided account holder name instead of the payer name from the invoice
        accountHolderAddressOverride:
          $ref: '#/components/schemas/commons_Address'
          description: If provided, will print a check with the provided account holder address instead of the payer address from the invoice
        signatoryName:
          type: string
          description: Name of the person who's signature will be printed on the check.
        signatureImage:
          type: string
          description: Base64 encoded image of the signature. If not provided, will use the signatoryName to generate a signature. Mercoa will automatically grayscale, resize, and convert the image to a PNG the image to fit on the check.
        useSignatureImage:
          type: boolean
          description: If true, will print checks with the provided signatureImage. If false, will print checks with a generated signature from the signatoryName. If this parameter is not set the default behavior is to use the signatureImage if provided.
      required:
      - signatoryName
      title: BankAccountCheckOptions
    paymentMethodTypes_BankType:
      type: string
      enum:
      - CHECKING
      - SAVINGS
      - UNKNOWN
      title: BankType
    paymentMethodTypes_CustomPaymentMethodSchemaResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/paymentMethodTypes_CustomPaymentMethodSchemaId'
        name:
          type: string
        isSource:
          type: boolean
          description: This payment method can be used as a payment source for an invoice
        isDestination:
          type: boolean
          description: This payment method can be used as a payment destination for an invoice
        supportedCurrencies:
          type: array
          items:
            $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          description: List of currencies that this payment method supports.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/paymentMethodTypes_CustomPaymentMethodSchemaField'
        estimatedProcessingTime:
          type: integer
          description: Estimated time in days for this payment method to process a payments. 0 is an same-day payment methods, -1 is unknown processing time.
        maxAmount:
          type: number
          format: double
          description: The maximum amount that can be transferred from this payment method in a single transaction.
        minAmount:
          type: number
          format: double
          description: The minimum amount that can be transferred from this payment method in a single transaction. Default is 1.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - isSource
      - isDestination
      - supportedCurrencies
      - fields
      - estimatedProcessingTime
      - createdAt
      - updatedAt
      title: CustomPaymentMethodSchemaResponse
    paymentMethodTypes_CardType:
      type: string
      enum:
      - credit
      - debit
      - prepaid
      - unknown
      title: CardType
    paymentMethodTypes_BankStatus:
      type: string
      enum:
      - NEW
      - VERIFIED
      - VERIFICATION_FAILED
      - PENDING
      - ERRORED
      title: BankStatus
    paymentMethodTypes_CustomPaymentMethodSchemaFieldType:
      type: string
      enum:
      - text
      - number
      - select
      - date
      - phone
      - email
      - url
      - dynamicUrl
      - embeddedUrl
      - address
      - usBankRoutingNumber
      - usBankAccountNumber
      title: CustomPaymentMethodSchemaFieldType
    entityTypes_EntityId:
      type: string
      title: EntityId
    paymentMethodTypes_PaymentMethodResponse:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - bankAccount
            description: 'Discriminator value: bankAccount'
          id:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          isDefaultSource:
            type: boolean
            description: Indicates whether this payment method is the default source for the entity
          isDefaultDestination:
            type: boolean
            description: Indicates whether this payment method is the default destination for the entity
          supportedCurrencies:
            type: array
            items:
              $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          externalAccountingSystemId:
            type: string
            description: ID for this payment method in the external accounting system (e.g Rutter or Codat)
          frozen:
            type: boolean
            description: Frozen payment methods cannot be used for payments, but will still be returned in API responses.
          metadata:
            type: object
            additionalProperties:
              type: string
            description: Metadata associated with this payment method.
          confirmedByEntity:
            type: boolean
            description: (ALPHA, MAY BE REMOVED) Indicates whether the payment method has been verified by the entity. This is useful if another entity has added this payment method to this entity, and you want the owner of the payment method to verify it is correct.
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          accountName:
            type: string
          bankName:
            type: string
          routingNumber:
            type: string
          accountNumber:
            type: string
          accountType:
            $ref: '#/components/schemas/paymentMethodTypes_BankType'
          status:
            $ref: '#/components/schemas/paymentMethodTypes_BankStatus'
          checkOptions:
            $ref: '#/components/schemas/paymentMethodTypes_BankAccountCheckOptions'
            description: If check printing is enabled for the account, will return the check options for this bank account
        required:
        - type
        - id
        - isDefaultSource
        - isDefaultDestination
        - supportedCurrencies
        - frozen
        - metadata
        - createdAt
        - updatedAt
        - accountName
        - bankName
        - routingNumber
        - accountNumber
        - accountType
        - status
      - type: object
        properties:
          type:
            type: string
            enum:
            - card
            description: 'Discriminator value: card'
          id:
            $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          isDefaultSource:
