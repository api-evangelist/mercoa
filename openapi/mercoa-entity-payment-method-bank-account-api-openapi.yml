          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          payToTheOrderOf:
            type: string
          addressLine1:
            type: string
          addressLine2:
            type: string
          city:
            type: string
          stateOrProvince:
            type: string
          postalCode:
            type: string
          country:
