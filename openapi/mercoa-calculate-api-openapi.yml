          application/json:
            schema:
              $ref: '#/components/schemas/calculate_CalculatePaymentTimingRequest'
      security:
      - default: []
components:
  schemas:
    invoiceTypes_InvoiceFeesResponse:
      type: object
      properties:
        sourcePaymentMethodFee:
          type: number
          format: double
          description: Fee charged to the platform (C1) for processing the source payment method. For example, credit card interchange and acquiring fees.
        sourcePlatformMarkupFee:
          type: number
          format: double
          description: Fee charged to the payer (C2).
        destinationPaymentMethodFee:
          type: number
          format: double
          description: Fee charged to the platform (C1) for processing the destination payment method. For example, postage for a check payment.
        destinationPlatformMarkupFee:
          type: number
          format: double
          description: Fee charged to the payee (C3).
      required:
      - sourcePaymentMethodFee
      - sourcePlatformMarkupFee
      - destinationPaymentMethodFee
      - destinationPlatformMarkupFee
      title: InvoiceFeesResponse
    calculate_InvoiceTiming:
      type: object
      properties:
        invoiceId:
          $ref: '#/components/schemas/invoiceTypes_InvoiceId'
      required:
      - invoiceId
      title: InvoiceTiming
    calculate_FeeCalculationType:
      type: string
      enum:
      - PAYABLE
      - RECEIVABLE
      description: Type of payment to calculate fees for.
      title: FeeCalculationType
    invoiceTypes_PaymentDestinationOptions:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - check
            description: 'Discriminator value: check'
          delivery:
            $ref: '#/components/schemas/invoiceTypes_CheckDeliveryMethod'
            description: Delivery method for check disbursements. Defaults to MAIL.
          printDescription:
            type: boolean
            description: If true, prints the invoice description (noteToSelf) on the check note. Defaults to false.
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - bankAccount
            description: 'Discriminator value: bankAccount'
          delivery:
            $ref: '#/components/schemas/invoiceTypes_BankDeliveryMethod'
            description: Delivery method for ACH payments. Defaults to ACH_SAME_DAY.
          description:
            type: string
            description: 'ACH Statement Description.

              By default, this will be ''AP'' followed by the first 8 characters of the invoice ID (for a single invoice) or the first 8 characters of the transaction ID (for a batch payment).

              Must be at least 4 characters and no more than 10 characters, and follow this regex pattern `^[a-zA-Z0-9\-#.$&* ]{4,10}$`'
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - utility
            description: 'Discriminator value: utility'
          accountId:
            type: string
            description: The ID for the utility account to pay with. Links to accounts listed on payor/payee relationship.
        required:
        - type
        - accountId
      - type: object
        properties:
          type:
            type: string
            enum:
            - custom
            description: 'Discriminator value: custom'
          dynamicUrls:
            type: object
            additionalProperties:
              type: string
            description: Map of field names to dynamic URL values that will be used for dynamicUrl fields in custom payment method schemas
        required:
        - type
      discriminator:
        propertyName: type
      title: PaymentDestinationOptions
