    calculate_CalculateFeesRequest:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Total amount in major units. If the entered amount has more decimal places than the currency supports, trailing decimals will be truncated.
        currency:
          $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          description: Currency code for the amount. Defaults to USD.
        creatorEntityId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: ID of the entity creating the invoice. If not provided, the fees will be calculated with the default pricing for the organization.
        paymentSourceId:
          $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          description: ID of payment source.
        paymentDestinationId:
          $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          description: ID of payment destination.
        paymentDestinationOptions:
          $ref: '#/components/schemas/invoiceTypes_PaymentDestinationOptions'
          description: Options for the payment destination. Depending on the payment destination, this may include things such as check delivery method.
        type:
          $ref: '#/components/schemas/calculate_FeeCalculationType'
          description: Type of payment to calculate fees for. Defaults to PAYABLE (Accounts Payable).
      required:
      - amount
      - paymentSourceId
      - paymentDestinationId
      title: CalculateFeesRequest
    calculate_CalculatePaymentTimingResponse:
      type: object
      properties:
        estimatedProcessingDate:
          type: string
          format: date-time
          description: Estimated date the payment will be or was processed.
        businessDays:
          type: integer
          description: Number of business days between the estimated processing date and the estimated settlement date. This does not take into account bank holidays or weekends.
        estimatedProcessingTime:
          type: integer
          description: Estimated payment time in days. This time takes into account bank holidays and weekends.
        estimatedSettlementDate:
          type: string
          format: date-time
          description: Estimated date the payment will be or was settled. This is the same as the request's deductionDate plus the paymentTiming.
      required:
      - estimatedProcessingDate
      - businessDays
      - estimatedProcessingTime
      - estimatedSettlementDate
      title: CalculatePaymentTimingResponse
    invoiceTypes_CheckDeliveryMethod:
      type: string
      enum:
      - PRINT
      - MAIL
      - MAIL_PRIORITY
      - MAIL_UPS_NEXT_DAY
      title: CheckDeliveryMethod
    entityTypes_EntityId:
      type: string
      title: EntityId
    invoiceTypes_InvoiceId:
      type: string
      title: InvoiceId
    paymentMethodTypes_PaymentMethodId:
      type: string
      title: PaymentMethodId
    invoiceTypes_BankDeliveryMethod:
      type: string
      enum:
      - ACH_STANDARD
      - ACH_SAME_DAY
      - ACH_ACCELERATED
      title: BankDeliveryMethod
    calculate_EstimatedTiming:
      type: object
      properties:
        estimatedDeductionDate:
          type: string
          format: date-time
          description: Date the payment is scheduled to be deducted from the payer's account. Use this field if the payment has not yet been deducted.
        processedAt:
          type: string
          format: date-time
          description: Date the payment was processed. Use this field if the payment has already been deducted.
        paymentSourceId:
          $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          description: ID of payment source.
        paymentDestinationId:
          $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          description: ID of payment destination.
        paymentDestinationOptions:
          $ref: '#/components/schemas/invoiceTypes_PaymentDestinationOptions'
          description: Options for the payment destination. Depending on the payment destination, this may include things such as check delivery method.
      required:
      - paymentSourceId
      - paymentDestinationId
      title: EstimatedTiming
    calculate_CalculatePaymentTimingRequest:
      oneOf:
      - $ref: '#/components/schemas/calculate_EstimatedTiming'
      - $ref: '#/components/schemas/calculate_InvoiceTiming'
      title: CalculatePaymentTimingRequest
  securitySchemes:
    default:
      type: http
      scheme: bearer
