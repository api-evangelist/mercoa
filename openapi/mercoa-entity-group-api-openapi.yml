components:
  schemas:
    entityTypes_TaxID:
      type: object
      properties:
        ein:
          $ref: '#/components/schemas/entityTypes_Ein'
      required:
      - ein
      title: TaxID
    entityGroupTypes_EntityGroupAddEntitiesRequest:
      type: object
      properties:
        entityIds:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityId'
          description: List of entity IDs or foreign IDs to add to the group
        copyUsersFrom:
          $ref: '#/components/schemas/entityGroupTypes_EntityIdOrBoolean'
          description: 'Entity ID / foreign ID of an entity currently in the group to copy users and roles from OR a boolean defining if users should be copied to the new entities.


            If not provided or false, users and roles will not be copied.

            If true, users and roles will be copied from the entity with the most users that has been updated most recently.

            If a valid ID is provided, users and roles will be copied from the corresponding provided entity in the group.


            Note: If users copied, any preexisting users will be left alone, and users with the same foreign ID will not be copied.'
        filterRoles:
          type: array
          items:
            type: string
          description: List of roles to filter users by. If not provided, all users will be copied. If provided, only users with the provided roles will be copied.
      required:
      - entityIds
      title: EntityGroupAddEntitiesRequest
    entityTypes_TokenGenerationStyleOptions:
      type: object
      properties:
        primaryColor:
          type: string
      required:
      - primaryColor
      title: TokenGenerationStyleOptions
    entityTypes_IndividualProfileResponse:
      type: object
      properties:
        email:
          type: string
        name:
          $ref: '#/components/schemas/commons_FullName'
        phone:
          $ref: '#/components/schemas/commons_PhoneNumber'
        address:
          $ref: '#/components/schemas/commons_Address'
        birthDateProvided:
          type: boolean
        governmentIDProvided:
          type: boolean
      required:
      - name
      - birthDateProvided
      - governmentIDProvided
      title: IndividualProfileResponse
    entityTypes_TokenGenerationOptions:
      type: object
      properties:
        expiresIn:
          type: string
          description: Expressed in seconds or a string describing a time span. The default is 1h.
        invoice:
          $ref: '#/components/schemas/entityTypes_TokenGenerationInvoiceOptions'
        pages:
          $ref: '#/components/schemas/entityTypes_TokenGenerationPagesOptions'
        style:
          $ref: '#/components/schemas/entityTypes_TokenGenerationStyleOptions'
        vendors:
          $ref: '#/components/schemas/entityTypes_TokenGenerationVendorOptions'
        entity:
          $ref: '#/components/schemas/entityTypes_TokenGenerationEntityOptions'
        sessionId:
          type: string
          description: Optional session ID to use for the token. If not provided, this token will not be associated with a session.
      title: TokenGenerationOptions
    entityTypes_LineItemAvailabilities:
      type: string
      enum:
      - DISABLED
      - OPTIONAL
      - REQUIRED
      title: LineItemAvailabilities
    entityTypes_EntityId:
      type: string
      title: EntityId
    entityTypes_BusinessProfileResponse:
      type: object
      properties:
        email:
          type: string
        legalBusinessName:
