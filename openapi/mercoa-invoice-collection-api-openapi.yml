components:
  schemas:
    collectionTypes_ActionResponse:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - email
            description: 'Discriminator value: email'
          id:
            $ref: '#/components/schemas/collectionTypes_ActionId'
          scheduledExecutionTime:
            type: string
            format: date-time
            description: The UTC timestamp for when this action is scheduled for execution. Actual execution may be delayed by a few minutes due to processing time.
          status:
            $ref: '#/components/schemas/collectionTypes_ActionStatus'
            description: The current lifecycle state of the action. SUGGESTED actions are pending approval, APPROVED actions will be executed, and COMPLETED actions have been executed.
          subject:
            type: string
            description: The subject of the email
          body:
            type: string
            description: The body of the email in plaintext
        required:
        - type
        - id
        - scheduledExecutionTime
        - status
        - subject
        - body
      discriminator:
        propertyName: type
      title: ActionResponse
    collectionTypes_UpdateNextActionRequest:
      type: object
      properties:
        feedback:
          type: string
          description: Natural language feedback to update the collection agent's next action
      required:
      - feedback
      title: UpdateNextActionRequest
    invoiceTypes_InvoiceId:
      type: string
      title: InvoiceId
    collectionTypes_ActionStatus:
      type: string
      enum:
      - SUGGESTED
      - APPROVED
      - COMPLETED
      title: ActionStatus
    collectionTypes_ActionId:
      type: string
      title: ActionId
  securitySchemes:
    default:
      type: http
      scheme: bearer
