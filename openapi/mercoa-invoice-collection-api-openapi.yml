        description: Invoice ID or Invoice ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collectionTypes_ActionResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
