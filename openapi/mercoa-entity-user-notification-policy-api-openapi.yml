components:
  schemas:
    entityTypes_UserNotificationPolicyResponse:
      type: object
      properties:
        disabled:
          type: boolean
          description: True if the selected notification type is disabled for this user
        digest:
          type: boolean
          description: True if the selected notification type is sent as a digest.
        immediate:
          type: boolean
          description: True if the selected notification type is sent immediately.
        type:
          $ref: '#/components/schemas/entityTypes_NotificationType'
      required:
      - disabled
      - digest
      - immediate
      - type
      title: UserNotificationPolicyResponse
    entityTypes_NotificationType:
      type: string
      enum:
      - INVOICE_APPROVAL_NEEDED
      - INVOICE_APPROVED
      - INVOICE_REJECTED
      - INVOICE_SCHEDULED
      - INVOICE_PENDING
      - INVOICE_PAID
      - INVOICE_CANCELED
      - INVOICE_CREATED
      - INVOICE_EMAILED
      - INVOICE_FAILED
      - COUNTERPARTY_ONBOARDING_COMPLETED
      title: NotificationType
    entityTypes_EntityUserId:
      type: string
      title: EntityUserId
    entityTypes_EntityId:
      type: string
      title: EntityId
    entityTypes_UserNotificationPolicyRequest:
      type: object
      properties:
        disabled:
          type: boolean
          description: Set to true if the selected notification type should be disabled for this user
        digest:
          type: boolean
          description: Set to true if the selected notification type should be sent as a digest. Default is false.
        immediate:
          type: boolean
          description: Set to true if the selected notification type should be sent immediately. Default is true.
      title: UserNotificationPolicyRequest
  securitySchemes:
    default:
      type: http
      scheme: bearer
