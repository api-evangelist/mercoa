      security:
      - default: []
  /entity/{entityId}/emailLog/{logId}:
    get:
      operationId: entity_emailLog_get
      summary: Get incoming email log
      description: Get an email log by ID
      tags:
      - entity > email-log
      parameters:
      - name: entityId
        in: path
        description: Entity ID or Entity ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: logId
        in: path
