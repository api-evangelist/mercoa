paths:
  /entity/{entityId}/users:
    get:
      operationId: entity_user_find
      summary: Search entity users
      tags:
      - entity > user
      parameters:
      - name: entityId
        in: path
        description: Entity ID or Entity ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: foreignId
        in: query
        description: ID used to identify user in your system
        required: false
        schema:
          type: string
      - name: role
        in: query
        description: Filter users by role. If multiple roles are provided, users with any of the roles will be returned.
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: Filter users by name. Partial matches are supported.
        required: false
        schema:
          type: string
      - name: email
        in: query
        description: Filter users by email. Partial matches are supported.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of entities to return. Limit can range between 1 and 100, and the default is 10.
        required: false
        schema:
          type: integer
      - name: startingAfter
        in: query
        description: The ID of the user to start after. If not provided, the first page of entities will be returned.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entityTypes_FindEntityUserResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
