components:
  schemas:
    entityTypes_VendorNetwork:
      type: string
      enum:
      - all
      - platform
      - entity
      title: VendorNetwork
    entityTypes_TokenGenerationPagesOptions:
      type: object
      properties:
        paymentMethods:
          type: boolean
        representatives:
          type: boolean
        notifications:
          type: boolean
        counterparties:
          type: boolean
        approvals:
          type: boolean
        emailLog:
          type: boolean
      title: TokenGenerationPagesOptions
    entityTypes_EntityUserRequest:
      type: object
      properties:
        foreignId:
          type: string
          description: The ID used to identify this user in your system.
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
          description: 'List of roles. A role can be any string. For example: "payer", "approver", "viewer"'
      title: EntityUserRequest
    invoiceTypes_InvoiceStatus:
      type: string
      enum:
      - UNASSIGNED
      - DRAFT
      - NEW
      - APPROVED
      - SCHEDULED
      - PENDING
      - PAID
      - ARCHIVED
      - REFUSED
      - CANCELED
      - FAILED
      title: InvoiceStatus
    entityTypes_TokenGenerationStyleOptions:
      type: object
      properties:
        primaryColor:
          type: string
      required:
      - primaryColor
      title: TokenGenerationStyleOptions
    entityTypes_TokenGenerationOptions:
      type: object
      properties:
        expiresIn:
          type: string
          description: Expressed in seconds or a string describing a time span. The default is 1h.
        invoice:
          $ref: '#/components/schemas/entityTypes_TokenGenerationInvoiceOptions'
        pages:
          $ref: '#/components/schemas/entityTypes_TokenGenerationPagesOptions'
        style:
          $ref: '#/components/schemas/entityTypes_TokenGenerationStyleOptions'
        vendors:
          $ref: '#/components/schemas/entityTypes_TokenGenerationVendorOptions'
        entity:
          $ref: '#/components/schemas/entityTypes_TokenGenerationEntityOptions'
        sessionId:
          type: string
          description: Optional session ID to use for the token. If not provided, this token will not be associated with a session.
      title: TokenGenerationOptions
    entityTypes_EntityUserId:
      type: string
      title: EntityUserId
    entityTypes_TokenGenerationEntityOptions:
      type: object
      properties:
        enableMercoaPayments:
          type: boolean
          description: If true, will require entity to undergo KYB to use Mercoa payment rails and will capture required KYB data in the portal.
      title: TokenGenerationEntityOptions
    entityTypes_TokenGenerationInvoiceOptions:
      type: object
      properties:
        lineItems:
          $ref: '#/components/schemas/entityTypes_LineItemAvailabilities'
          description: Defaults to OPTIONAL. If set to REQUIRED, the user will be required to provide at least one line item when creating an invoice. If set to DISABLED, the user will not be able to provide line items when creating an invoice.
        status:
          type: array
          items:
            $ref: '#/components/schemas/invoiceTypes_InvoiceStatus'
        recurring:
          type: boolean
          description: If true, recurring invoice templates will be available to the user.
      required:
      - status
      title: TokenGenerationInvoiceOptions
    entityTypes_LineItemAvailabilities:
      type: string
      enum:
      - DISABLED
      - OPTIONAL
      - REQUIRED
      title: LineItemAvailabilities
    entityTypes_EntityId:
      type: string
      title: EntityId
    entityTypes_TokenGenerationVendorOptions:
      type: object
      properties:
        disableCreation:
          type: boolean
          description: If true, the user will not be able to create new vendors.
        network:
          $ref: '#/components/schemas/entityTypes_VendorNetwork'
      required:
      - network
      title: TokenGenerationVendorOptions
    entityTypes_FindEntityUserResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total number of users for the given filters. This value is not limited by the limit parameter. It is provided so that you can determine how many pages of results are available.
        hasMore:
          type: boolean
          description: True if there are more users available for the given filters.
        data:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityUserResponse'
      required:
      - count
      - hasMore
      - data
      title: FindEntityUserResponse
    entityTypes_EntityUserResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
        foreignId:
          type: string
          description: The ID used to identify this user in your system.
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - roles
      - createdAt
      - updatedAt
      title: EntityUserResponse
  securitySchemes:
    default:
      type: http
      scheme: bearer
