                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      security:
      - default: []
components:
  schemas:
    commons_BulkDownloadFormat:
      type: string
      enum:
      - CSV
      - JSON
      title: BulkDownloadFormat
    entityTypes_CounterpartyNetworkType:
      type: string
      enum:
      - ENTITY
      - NETWORK
      title: CounterpartyNetworkType
    commons_BulkDownloadResponse:
      type: object
      properties:
        url:
          type: string
        mimeType:
          type: string
      required:
      - url
      - mimeType
      title: BulkDownloadResponse
    entityTypes_EntityId:
      type: string
      title: EntityId
    commons_StringOrStringArray:
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      title: StringOrStringArray
    invoiceTypes_MetadataFilter:
      type: object
      properties:
        key:
          type: string
        value:
          $ref: '#/components/schemas/commons_StringOrStringArray'
          description: If multiple values are provided, the filter will match if any of the values match (OR filter). To filter for the absence of a key, use the value 'NULL'. To filter for the presence of a key, use the value 'NOT NULL'.
      required:
      - key
      - value
      title: MetadataFilter
  securitySchemes:
    default:
      type: http
      scheme: bearer
