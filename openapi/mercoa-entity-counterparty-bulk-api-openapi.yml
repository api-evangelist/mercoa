openapi: 3.2.0
info:
  title: Reference entity > counterparty > bulk API
  version: 1.0.0
servers:
- url: https://api.mercoa.com
  description: Production
tags:
- name: entity > counterparty > bulk
paths:
  /entity/{entityId}/counterparties/payees/download:
    get:
      operationId: entity_counterparty_bulk_downloadPayees
      summary: Download Bulk Payees
      description: Get a URL to download payee counterparties as a CSV/JSON file. This endpoint lets you download vendors linked to the entity.
      tags:
      - entity > counterparty > bulk
      parameters:
      - name: entityId
        in: path
        description: Entity ID or Entity ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: format
        in: query
        description: Format of the file to download. Defaults to CSV.
        required: false
        schema:
          $ref: '#/components/schemas/commons_BulkDownloadFormat'
      - name: search
        in: query
        description: Filter counterparties by name or email. Partial matches are supported.
        required: false
        schema:
          type: string
      - name: networkType
        in: query
        description: Filter by network type. By default, only ENTITY counterparties are returned.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_CounterpartyNetworkType'
      - name: paymentMethods
        in: query
        description: If true, will include counterparty payment methods as part of the response
        required: false
        schema:
          type: boolean
      - name: invoiceMetrics
        in: query
        description: If true, will include counterparty invoice metrics as part of the response
        required: false
        schema:
          type: boolean
      - name: counterpartyId
        in: query
        description: Filter by counterparty ids (Foreign ID is supported)
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: metadata
        in: query
        description: Filter counterparties by simple key/value metadata. Each filter will be applied as an AND condition. Duplicate keys will be ignored.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_MetadataFilter'
      - name: returnMetadata
        in: query
        description: If true, will return simple key/value metadata for the counterparties. For more complex metadata, use the Metadata API.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commons_BulkDownloadResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      security:
      - default: []
  /entity/{entityId}/counterparties/payors/download:
    get:
      operationId: entity_counterparty_bulk_downloadPayors
