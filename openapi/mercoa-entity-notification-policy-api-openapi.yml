components:
  schemas:
    entityTypes_NotificationType:
      type: string
      enum:
      - INVOICE_APPROVAL_NEEDED
      - INVOICE_APPROVED
      - INVOICE_REJECTED
      - INVOICE_SCHEDULED
      - INVOICE_PENDING
      - INVOICE_PAID
      - INVOICE_CANCELED
      - INVOICE_CREATED
      - INVOICE_EMAILED
      - INVOICE_FAILED
      - COUNTERPARTY_ONBOARDING_COMPLETED
      title: NotificationType
    entityTypes_EntityUserId:
      type: string
      title: EntityUserId
    entityTypes_NotificationPolicyRequest:
      type: object
      properties:
        disabled:
          type: boolean
          description: Set to true if the selected notification type should be disabled for this entity
        additionalRoles:
          type: array
          items:
            type: string
          description: List of user roles that should receive notifications in addition to the default users for this notification type
        additionalUsers:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityUserId'
          description: List of user IDs that should receive notifications in addition to the default users for this notification type
        notifyPayeeCounterparty:
          type: boolean
          description: Set to true if the selected notification type should be sent to the counterparty if this is a payable invoice.
        notifyPayorCounterparty:
          type: boolean
          description: Set to true if the selected notification type should be sent to the counterparty if this is a receivable invoice.
      title: NotificationPolicyRequest
    entityTypes_NotificationPolicyResponse:
      type: object
      properties:
        disabled:
          type: boolean
          description: True if the selected notification type is disabled for this entity
        additionalRoles:
          type: array
          items:
            type: string
          description: List of user roles that should receive notifications in addition to the default users for this notification type
        additionalUsers:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityUserId'
          description: List of user IDs that should receive notifications in addition to the default users for this notification type
        notifyPayeeCounterparty:
          type: boolean
          description: True if the selected notification type should be sent to the counterparty if this is a payable invoice.
        notifyPayorCounterparty:
          type: boolean
          description: True if the selected notification type should be sent to the counterparty if this is a receivable invoice.
        type:
          $ref: '#/components/schemas/entityTypes_NotificationType'
      required:
      - disabled
      - additionalRoles
      - additionalUsers
      - notifyPayeeCounterparty
      - notifyPayorCounterparty
      - type
      title: NotificationPolicyResponse
    entityTypes_EntityId:
      type: string
      title: EntityId
  securitySchemes:
    default:
      type: http
      scheme: bearer
