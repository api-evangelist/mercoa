  /entity/{entityId}/counterparty/{counterpartyId}/vendor-credits/estimate-usage:
    get:
      operationId: entity_counterparty_vendorCredit_estimateUsage
      summary: Estimate Vendor Credit Usage
      description: Estimate the usage of vendor credits on an invoice of a given amount
      tags:
      - entity > counterparty > vendor-credit
      parameters:
      - name: entityId
        in: path
        description: Entity ID or Entity ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: counterpartyId
        in: path
        description: Counterparty Entity ID or Counterparty Entity ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: amount
        in: query
        description: The amount of the invoice to calculate vendor credit usage for.
        required: true
        schema:
          type: number
          format: double
      - name: currency
        in: query
        description: The currency of the invoice to calculate vendor credit usage for. Defaults to USD.
        required: false
        schema:
          $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
      - name: excludedInvoiceIds
        in: query
        description: List of invoice IDs to exclude from the calculation. If not provided or an empty list, no invoices will be excluded. This is useful for recalculating vendor credit usage on invoices that already have vendor credits applied.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/invoiceTypes_InvoiceId'
      - name: includedVendorCreditIds
        in: query
        description: List of vendor credit IDs to include in the calculation. If not provided, all applicable vendor credits will be included, while an empty list will not include ANY vendor credits.  This is useful for recalculating vendor credit usage on invoices that have a fixed list of applied vendor credits (e.g. a SCHEDULED or PENDING invoice).
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/vendorCreditTypes_VendorCreditId'
      responses:
        '200':
          description: The vendor credit usage estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vendorCreditTypes_CalculateVendorCreditUsageResponse'
        '400':
