components:
  schemas:
    vendorCreditTypes_VendorCreditResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/vendorCreditTypes_VendorCreditId'
        memoNumber:
          type: string
          description: Memo number for the vendor credit
        totalAmount:
          type: number
          format: double
          description: Total issued amount of the vendor credit in major units
        remainingAmount:
          type: number
          format: double
          description: Remaining usable amount in the vendor credit in major units
        currency:
          $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          description: Currency code for the amount. Defaults to USD.
        vendorId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: ID of the vendor the vendor credit may be used for
        payerId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: ID of the payer who may use the vendor credit
        creatorEntityId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: ID of the entity that created this vendor credit
        note:
          type: string
          description: An optional note to attach to the vendor credit
        invoiceIds:
          type: array
          items:
            $ref: '#/components/schemas/invoiceTypes_InvoiceId'
          description: The IDs of the invoices that this vendor credit has been applied to
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - vendorId
      - payerId
      - createdAt
      - updatedAt
      title: VendorCreditResponse
    vendorCreditTypes_CalculateVendorCreditUsageResponse:
      type: object
      properties:
        remainingAmount:
          type: number
          format: double
          description: Remaining amount on the invoice after vendor credits are applied in major units.
        currency:
          $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          description: Currency code for the amount. Defaults to USD.
        vendorCredits:
          type: array
          items:
            $ref: '#/components/schemas/vendorCreditTypes_VendorCreditResponse'
          description: Vendor credits that will be applied to the invoice. The objects returned represent the states each vendor credit will be in AFTER they are applied to the invoice, not their current states.
      required:
      - remainingAmount
      - currency
      - vendorCredits
      title: CalculateVendorCreditUsageResponse
    vendorCreditTypes_VendorCreditRequest:
      type: object
      properties:
        memoNumber:
          type: string
          description: Memo number for the vendor credit
        totalAmount:
          type: number
          format: double
          description: Total amount of the vendor credit in major units
        currency:
          $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          description: Currency code for the amount. Defaults to USD.
        note:
          type: string
          description: An optional note to attach to the vendor credit
      required:
      - totalAmount
      - currency
      title: VendorCreditRequest
    vendorCreditTypes_FindVendorCreditResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total number of vendor credits for the given filters. This value is not limited by the limit parameter. It is provided so that you can determine how many pages of results are available.
        hasMore:
          type: boolean
          description: True if there are more vendor credits available for the given filters.
        data:
          type: array
          items:
            $ref: '#/components/schemas/vendorCreditTypes_VendorCreditResponse'
      required:
      - count
      - hasMore
      - data
      title: FindVendorCreditResponse
    entityTypes_EntityId:
      type: string
      title: EntityId
    invoiceTypes_InvoiceId:
      type: string
      title: InvoiceId
    vendorCreditTypes_VendorCreditId:
      type: string
      title: VendorCreditId
