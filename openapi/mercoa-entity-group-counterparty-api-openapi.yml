components:
  schemas:
    entityTypes_EntityHidePayorsRequest:
      type: object
      properties:
        payors:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityId'
          description: List of payor entity IDs or foreign IDs to hide
      required:
      - payors
      title: EntityHidePayorsRequest
    entityGroupTypes_EntityGroupId:
      type: string
      title: EntityGroupId
    entityTypes_EntityAddPayorsRequest:
      type: object
      properties:
        payors:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityId'
          description: List of payor entity IDs or foreign IDs to associate with the entity
        customizations:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_CounterpartyCustomizationRequest'
          description: List of customizations to apply to the payors. If the payor is not currently a counterparty of the entity, the counterparty will be created with the provided customizations.
      required:
      - payors
      title: EntityAddPayorsRequest
    entityTypes_CounterpartyCustomizationAccount:
      type: object
      properties:
        accountId:
          type: string
          description: The ID the counterparty has assigned to this account.
        postalCode:
          type: string
          description: The postal code the counterparty has assigned to this account.
        nameOnAccount:
          type: string
          description: The name on the account the counterparty has assigned to this account.
      required:
      - accountId
      title: CounterpartyCustomizationAccount
    entityTypes_EntityId:
      type: string
      title: EntityId
    entityTypes_EntityAddPayeesRequest:
      type: object
      properties:
        payees:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityId'
          description: List of payee entity IDs or foreign IDs to associate with the entity
        customizations:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_CounterpartyCustomizationRequest'
          description: List of customizations to apply to the payees. If the payee is not currently a counterparty of the entity, the counterparty will be created with the provided customizations.
      required:
      - payees
      title: EntityAddPayeesRequest
    entityTypes_EntityHidePayeesRequest:
      type: object
      properties:
        payees:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityId'
          description: List of payee entity IDs or foreign IDs to hide
      required:
      - payees
      title: EntityHidePayeesRequest
    entityTypes_CounterpartyCustomizationRequest:
      type: object
      properties:
        counterpartyId:
          $ref: '#/components/schemas/entityTypes_EntityId'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_CounterpartyCustomizationAccount'
          description: The list of accounts the entity has with the counterparty.
      required:
      - counterpartyId
      title: CounterpartyCustomizationRequest
  securitySchemes:
    default:
      type: http
      scheme: bearer
