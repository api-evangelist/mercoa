components:
  schemas:
    paymentMethodTypes_CustomPaymentMethodSchemaRequest:
      type: object
      properties:
        name:
          type: string
        isSource:
          type: boolean
          description: This payment method can be used as a payment source for an invoice
        isDestination:
          type: boolean
          description: This payment method can be used as a payment destination for an invoice
        supportedCurrencies:
          type: array
          items:
            $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          description: List of currencies that this payment method supports. If not provided, the payment method will support only USD.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/paymentMethodTypes_CustomPaymentMethodSchemaField'
        estimatedProcessingTime:
          type: integer
          description: Estimated time in days for this payment method to process a payments. Set as 0 for same-day payment methods, -1 for unknown processing time.
        maxAmount:
          type: number
          format: double
          description: The maximum amount that can be transferred from this payment method in a single transaction.
        minAmount:
          type: number
          format: double
          description: The minimum amount that can be transferred from this payment method in a single transaction. Default is 1.
      required:
      - name
      - isSource
      - isDestination
      - fields
      title: CustomPaymentMethodSchemaRequest
    paymentMethodTypes_CustomPaymentMethodSchemaId:
      type: string
      title: CustomPaymentMethodSchemaId
    paymentMethodTypes_CustomPaymentMethodSchemaField:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        type:
          $ref: '#/components/schemas/paymentMethodTypes_CustomPaymentMethodSchemaFieldType'
        optional:
          type: boolean
          description: Indicates whether this field is optional
        useAsAccountName:
          type: boolean
          description: Indicates whether this field should be used as the name of the payment method. Only one field can be used as the name. Will set the accountName field of the payment method to the value of this field.
        useAsAccountNumber:
          type: boolean
          description: Indicates whether this field should be used as the account number of the payment method. Only one field can be used as the account number. Will set the accountNumber field of the payment method to the value of this field.
        options:
          type: array
          items:
            type: string
          description: When type is 'select', provide options that can be selected
      required:
      - name
      - type
      - optional
      title: CustomPaymentMethodSchemaField
    paymentMethodTypes_CustomPaymentMethodSchemaResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/paymentMethodTypes_CustomPaymentMethodSchemaId'
        name:
          type: string
        isSource:
          type: boolean
          description: This payment method can be used as a payment source for an invoice
        isDestination:
          type: boolean
          description: This payment method can be used as a payment destination for an invoice
        supportedCurrencies:
          type: array
          items:
            $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          description: List of currencies that this payment method supports.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/paymentMethodTypes_CustomPaymentMethodSchemaField'
        estimatedProcessingTime:
          type: integer
          description: Estimated time in days for this payment method to process a payments. 0 is an same-day payment methods, -1 is unknown processing time.
        maxAmount:
          type: number
          format: double
          description: The maximum amount that can be transferred from this payment method in a single transaction.
        minAmount:
          type: number
          format: double
          description: The minimum amount that can be transferred from this payment method in a single transaction. Default is 1.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - isSource
      - isDestination
      - supportedCurrencies
      - fields
      - estimatedProcessingTime
      - createdAt
      - updatedAt
      title: CustomPaymentMethodSchemaResponse
    paymentMethodTypes_CustomPaymentMethodSchemaFieldType:
      type: string
      enum:
      - text
      - number
      - select
      - date
      - phone
      - email
      - url
      - dynamicUrl
      - embeddedUrl
      - address
      - usBankRoutingNumber
      - usBankAccountNumber
      title: CustomPaymentMethodSchemaFieldType
