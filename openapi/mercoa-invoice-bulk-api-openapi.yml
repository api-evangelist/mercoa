openapi: 3.2.0
info:
  title: Reference invoice > bulk API
  version: 1.0.0
servers:
- url: https://api.mercoa.com
  description: Production
tags:
- name: invoice > bulk
paths:
  /invoices:
    post:
      operationId: invoice_bulk_create
      summary: Create Bulk Invoices (Sync)
      description: Create multiple invoices in bulk. This endpoint will process synchronously and return a list of invoices that were created or failed to create.
      tags:
      - invoice > bulk
      parameters:
      - name: emitWebhooks
        in: query
        description: If true, webhooks will be emitted for each invoice that is created. By default, webhooks are not emitted.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoiceTypes_BulkInvoiceCreationResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invoiceTypes_BulkInvoiceCreationRequest'
      security:
      - default: []
    put:
      operationId: invoice_bulk_update
      summary: Update Bulk Invoices (Sync)
      description: Update multiple invoices in bulk. This endpoint will process synchronously and return a list of invoices that were updated or failed to update.
      tags:
      - invoice > bulk
      parameters:
      - name: emitWebhooks
        in: query
        description: If true, webhooks will be emitted for each invoice that is updated. By default, webhooks are not emitted.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoiceTypes_BulkInvoiceUpdateResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invoiceTypes_BulkInvoiceUpdateRequest'
      security:
      - default: []
  /invoices/approve:
    post:
      operationId: invoice_bulk_approve
      summary: Approve Bulk Invoices (Sync)
      description: Approve multiple invoices in bulk. This endpoint will process synchronously and return a list of invoices that were approved or failed to approve.
      tags:
      - invoice > bulk
      parameters:
      - name: emitWebhooks
        in: query
        description: If true, webhooks will be emitted for each invoice that is approved. By default, webhooks are not emitted.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoiceTypes_BulkInvoiceApprovalResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invoiceTypes_BulkInvoiceApprovalRequest'
      security:
      - default: []
  /invoices/download:
    get:
      operationId: invoice_bulk_download
      summary: Download Bulk Invoices (Sync)
      description: Get a URL to download a bulk invoice as a CSV/JSON file.
      tags:
      - invoice > bulk
      parameters:
      - name: format
        in: query
        description: Format of the file to download. Defaults to CSV.
        required: false
        schema:
          $ref: '#/components/schemas/commons_BulkDownloadFormat'
      - name: entityId
        in: query
        description: Filter invoices by the ID or foreign ID of the entity that is the payer or the vendor of the invoice.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: entityGroupId
        in: query
        description: Filter invoices by the ID or foreign ID of the entity group that the entity belongs to.
        required: false
        schema:
          $ref: '#/components/schemas/entityGroupTypes_EntityGroupId'
      - name: startDate
        in: query
        description: Start date filter. Defaults to CREATED_AT unless specified the dateType is specified
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: End date filter. Defaults to CREATED_AT unless specified the dateType is specified
        required: false
        schema:
          type: string
          format: date-time
      - name: dateType
        in: query
        description: Type of date to filter by if startDate and endDate filters are provided. Defaults to CREATED_AT.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceDateFilter'
      - name: orderBy
        in: query
        description: Field to order invoices by. Defaults to CREATED_AT.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceOrderByField'
      - name: orderDirection
        in: query
        description: Direction to order invoices by. Defaults to asc.
        required: false
        schema:
          $ref: '#/components/schemas/commons_OrderDirection'
      - name: startingAfter
        in: query
        description: The ID of the invoice to start after. If not provided, the first page of invoices will be returned.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceId'
      - name: search
        in: query
        description: Find invoices by vendor name, invoice number, check number, or amount. Partial matches are supported.
        required: false
        schema:
          type: string
      - name: metadata
        in: query
        description: Filter invoices by metadata. Each filter will be applied as an AND condition. Duplicate keys will be ignored.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_MetadataFilter'
      - name: lineItemMetadata
        in: query
        description: Filter invoices by line item metadata. Each filter will be applied as an AND condition. Duplicate keys will be ignored.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_MetadataFilter'
      - name: lineItemGlAccountId
        in: query
        description: Filter invoices by line item GL account ID. Each filter will be applied as an OR condition. Duplicate keys will be ignored.
        required: false
        schema:
          type: string
      - name: payerId
        in: query
        description: Filter invoices by payer ID or payer foreign ID.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: vendorId
        in: query
        description: Filter invoices by vendor ID or vendor foreign ID.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: creatorUserId
        in: query
        description: Filter invoices by the ID or foreign ID of the user that created the invoice.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
      - name: approverId
        in: query
        description: Filter invoices by assigned approver user ID. Only invoices with all upstream policies approved will be returned.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
      - name: approverAction
        in: query
        description: Filter invoices by approver action. Needs to be used with approverId. For example, if you want to find all invoices that have been approved by a specific user, you would use approverId and approverAction=APPROVE.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_ApproverAction'
      - name: invoiceId
        in: query
        description: Filter invoices by invoice ID or invoice foreign ID.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceId'
      - name: status
        in: query
        description: Invoice status to filter on
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceStatus'
      - name: paymentType
        in: query
        description: Filter invoices by recurring status
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/invoiceTypes_PaymentType'
      - name: invoiceTemplateId
        in: query
        description: Filter invoice by invoice template ID
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceTemplateId'
      - name: returnPayerMetadata
        in: query
        description: Whether to return payer metadata in the response
        required: false
        schema:
          type: boolean
      - name: returnVendorMetadata
        in: query
        description: Whether to return vendor metadata in the response
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commons_BulkDownloadResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      security:
      - default: []
components:
  schemas:
    invoiceTypes_PaymentScheduleEndCondition:
      oneOf:
      - type: integer
      - type: string
        format: date-time
      title: PaymentScheduleEndCondition
    invoiceTypes_InvoiceLineItemCreationRequest:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          description: Currency code for the amount. Defaults to USD.
        name:
          type: string
        quantity:
          type: number
          format: double
        unitPrice:
          type: number
          format: double
          description: Unit price of the line item in major units. If the entered amount has more decimal places than the currency supports, trailing decimals will be truncated.
        category:
          type: string
          description: Category of the line item.
        serviceStartDate:
          type: string
          format: date-time
        serviceEndDate:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
        glAccountId:
          type: string
          description: ID of general ledger account associated with this line item.
        amount:
          type: number
          format: double
          description: Total amount of line item in major units. If the entered amount has more decimal places than the currency supports, trailing decimals will be truncated.
        description:
          type: string
      title: InvoiceLineItemCreationRequest
    invoiceTypes_InvoiceFeesRequest:
      type: object
      properties:
        sourcePlatformMarkupFee:
          type: number
          format: double
          description: Fee charged to the payer (C2).
        destinationPlatformMarkupFee:
          type: number
          format: double
          description: Fee charged to the payee (C3).
      required:
      - sourcePlatformMarkupFee
      - destinationPlatformMarkupFee
      title: InvoiceFeesRequest
    commons_BulkDownloadFormat:
      type: string
      enum:
      - CSV
      - JSON
      title: BulkDownloadFormat
    invoiceTypes_PaymentDestinationOptions:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - check
            description: 'Discriminator value: check'
          delivery:
            $ref: '#/components/schemas/invoiceTypes_CheckDeliveryMethod'
            description: Delivery method for check disbursements. Defaults to MAIL.
          printDescription:
            type: boolean
            description: If true, prints the invoice description (noteToSelf) on the check note. Defaults to false.
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - bankAccount
            description: 'Discriminator value: bankAccount'
          delivery:
            $ref: '#/components/schemas/invoiceTypes_BankDeliveryMethod'
            description: Delivery method for ACH payments. Defaults to ACH_SAME_DAY.
          description:
            type: string
            description: 'ACH Statement Description.

              By default, this will be ''AP'' followed by the first 8 characters of the invoice ID (for a single invoice) or the first 8 characters of the transaction ID (for a batch payment).

              Must be at least 4 characters and no more than 10 characters, and follow this regex pattern `^[a-zA-Z0-9\-#.$&* ]{4,10}$`'
        required:
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - utility
            description: 'Discriminator value: utility'
          accountId:
            type: string
            description: The ID for the utility account to pay with. Links to accounts listed on payor/payee relationship.
        required:
        - type
        - accountId
      - type: object
        properties:
          type:
            type: string
            enum:
            - custom
            description: 'Discriminator value: custom'
          dynamicUrls:
            type: object
            additionalProperties:
              type: string
            description: Map of field names to dynamic URL values that will be used for dynamicUrl fields in custom payment method schemas
        required:
        - type
      discriminator:
        propertyName: type
      title: PaymentDestinationOptions
    commons_OrderDirection:
      type: string
      enum:
      - ASC
      - DESC
      title: OrderDirection
    entityTypes_EntityUserId:
      type: string
      title: EntityUserId
    invoiceTypes_InvoiceUpdateRequestWithId:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/invoiceTypes_InvoiceStatus'
        amount:
          type: number
          format: double
          description: Total amount of invoice in major units. If the entered amount has more decimal places than the currency supports, trailing decimals will be truncated.
        currency:
          $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          description: Currency code for the amount. Defaults to USD.
        invoiceDate:
          type: string
          format: date-time
          description: Date the invoice was issued.
        deductionDate:
          type: string
          format: date-time
          description: Initial date when funds are scheduled to be deducted from payer's account.
        settlementDate:
          type: string
          format: date-time
          description: Date of funds settlement.
        dueDate:
          type: string
          format: date-time
          description: Due date of invoice.
        invoiceNumber:
          type: string
        noteToSelf:
          type: string
          description: Note to self or memo on invoice.
        serviceStartDate:
          type: string
          format: date-time
        serviceEndDate:
          type: string
          format: date-time
        netTerms:
          type: integer
          description: Net terms in days. Must be a positive number.
        payerId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: ID or foreign ID of the payer of this invoice.
        paymentSourceId:
          $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          description: ID of payment source for this invoice. If not provided, will attempt to use the default payment source for the payer when creating an invoice if a default payment source exists for the payer.
        paymentSourceOptions:
          $ref: '#/components/schemas/invoiceTypes_PaymentSourceOptions'
          description: Options for the payment source. Depending on the payment source, this may include things such as BNPL configuration.
        vendorId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: ID or foreign ID of the vendor of this invoice.
        paymentDestinationId:
          $ref: '#/components/schemas/paymentMethodTypes_PaymentMethodId'
          description: ID of payment destination for this invoice. If not provided, will attempt to use the default payment destination for the vendor when creating an invoice if a default payment destination exists for the vendor.
        paymentDestinationOptions:
          $ref: '#/components/schemas/invoiceTypes_PaymentDestinationOptions'
          description: Options for the payment destination. Depending on the payment destination, this may include things such as check delivery method.
        approvers:
          type: array
          items:
            $ref: '#/components/schemas/invoiceTypes_ApprovalSlotAssignment'
          description: Set approvers for this invoice.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Metadata associated with this invoice.
        foreignId:
          type: string
          description: The ID used to identify this invoice in your system. This ID must be unique within each creatorEntity in your system, e.g. two invoices with the same creatorEntity may not have the same foreign ID.
        document:
          type: string
          description: Base64-encoded string. Supported file types include PNG, JPG, WEBP, PDF, and all Microsoft Office formats (automatically converted to PDF). Max file size 10MB. If the invoice already has a document, this will add a new document to the invoice.
        uploadedImage:
          type: string
          description: DEPRECATED. Use document field instead.
          deprecated: true
        creatorUserId:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
          description: User ID or Foreign ID of entity user who created this invoice.
        failureType:
          $ref: '#/components/schemas/invoiceTypes_InvoiceFailureType'
          description: If the invoice failed to be paid, indicate the failure reason. Only applicable for invoices with custom payment methods.
        fees:
          $ref: '#/components/schemas/invoiceTypes_InvoiceFeesRequest'
          description: If using a custom payment method, you can override the default fees for this invoice. If not provided, the default fees for the custom payment method will be used.
        batchPayment:
          type: boolean
          description: If true, this invoice will be paid as a batch payment. Batches are automatically determined by Mercoa based on the payment source, destination, and scheduled payment date.
        paymentSchedule:
          $ref: '#/components/schemas/invoiceTypes_PaymentSchedule'
          description: If this is a recurring invoice, this will be the payment schedule for the invoice. If not provided, this will be a one-time invoice.
        vendorCreditIds:
          type: array
          items:
            $ref: '#/components/schemas/vendorCreditTypes_VendorCreditId'
          description: The IDs of the vendor credits to be applied to this invoice. Passing this field will un-apply any previously applied vendor credits.
        taxAmount:
          type: number
          format: double
          description: Tax amount for this invoice.
        shippingAmount:
          type: number
          format: double
          description: Shipping amount for this invoice.
        ocrJobId:
          $ref: '#/components/schemas/ocr_OCRJobId'
          description: ID of the OCR job that processed this invoice.
        paymentDestinationConfirmed:
          type: boolean
          description: Set to true if the payment destination has been confirmed by the vendor or if the payment destination should default to the selected payment destination on the vendor portal.
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/invoiceTypes_InvoiceLineItemUpdateRequest'
        creatorEntityId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: ID or foreign ID of entity who created this invoice. If creating a payable invoice (AP), this must be the same as the payerId. If creating a receivable invoice (AR), this must be the same as the vendorId.
        invoiceId:
          $ref: '#/components/schemas/invoiceTypes_InvoiceId'
          description: The ID or foreign ID of the invoice to update
      required:
      - invoiceId
      title: InvoiceUpdateRequestWithId
    commons_BulkDownloadResponse:
      type: object
      properties:
        url:
          type: string
