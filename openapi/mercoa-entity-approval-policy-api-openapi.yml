components:
  schemas:
    entityTypes_ApprovalPolicyId:
      type: string
      title: ApprovalPolicyId
    entityTypes_Trigger:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - amount
            description: 'Discriminator value: amount'
          amount:
            type: number
            format: double
          currency:
            $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
          comparison:
            $ref: '#/components/schemas/entityTypes_Comparison'
            description: The comparison operator to use when comparing the amount to the trigger amount. Defaults to gte.
        required:
        - type
        - amount
        - currency
      - type: object
        properties:
          type:
            type: string
            enum:
            - vendor
            description: 'Discriminator value: vendor'
          vendorIds:
            type: array
            items:
              $ref: '#/components/schemas/entityTypes_EntityId'
        required:
        - type
        - vendorIds
      - type: object
        properties:
          type:
            type: string
            enum:
            - metadata
            description: 'Discriminator value: metadata'
          key:
            type: string
            description: The metadata key to match
          value:
            type: array
            items:
              type: string
            description: The metadata value the invoice must have to trigger this policy
        required:
        - type
        - key
        - value
      - type: object
        properties:
          type:
            type: string
            enum:
            - catchall
            description: 'Discriminator value: catchall'
        required:
        - type
        description: A catchall trigger will trigger if no other triggers match.
      discriminator:
        propertyName: type
      title: Trigger
    entityTypes_ApprovalPolicyRequest:
      type: object
      properties:
        trigger:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_Trigger'
          description: List of triggers that will cause this policy to be evaluated. If no triggers are provided, the policy will be evaluated for all invoices.
        rule:
          $ref: '#/components/schemas/entityTypes_Rule'
        upstreamPolicyId:
          $ref: '#/components/schemas/entityTypes_ApprovalPolicyId'
          description: The policy ID of the previous approval policy in the chain of policies. Use 'root' if no upstreamPolicyId is intended to be set.
      required:
      - trigger
      - rule
      - upstreamPolicyId
      title: ApprovalPolicyRequest
    entityTypes_IdentifierList:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - rolesList
            description: 'Discriminator value: rolesList'
          value:
            type: array
            items:
              type: string
        required:
        - type
        - value
        description: List of entity user roles that should be used to determine approvers
      - type: object
        properties:
          type:
            type: string
            enum:
            - userList
            description: 'Discriminator value: userList'
          value:
            type: array
            items:
              $ref: '#/components/schemas/entityTypes_EntityUserId'
        required:
        - type
        - value
        description: List of entity user IDs that should be used to determine approvers
      discriminator:
        propertyName: type
      title: IdentifierList
    entityTypes_Rule:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - approver
            description: 'Discriminator value: approver'
          numApprovers:
            type: integer
            description: Number of approvals required to approve an invoice
          identifierList:
            $ref: '#/components/schemas/entityTypes_IdentifierList'
            description: List of users or roles that should be used to determine eligible approvers
          autoAssign:
            type: boolean
            description: If true, the policy will automatically assign approvers to the invoice. If more than one approver is eligible, the policy will assign all eligible approvers to the invoice.
        required:
        - type
        - numApprovers
        - identifierList
        description: A rule that will assign approvers to an invoice.
      - type: object
        properties:
          type:
            type: string
            enum:
            - automatic
            description: 'Discriminator value: automatic'
        required:
        - type
        description: A rule that will automatically approve an invoice, regardless of any other rules that were triggered.
      discriminator:
        propertyName: type
      title: Rule
    entityTypes_EntityUserId:
      type: string
      title: EntityUserId
    entityTypes_Comparison:
      type: string
      enum:
      - eq
      - gt
      - gte
      - lt
      - lte
      title: Comparison
    entityTypes_ApprovalPolicyUpdateRequest:
      type: object
      properties:
        trigger:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_Trigger'
        rule:
          $ref: '#/components/schemas/entityTypes_Rule'
        upstreamPolicyId:
          $ref: '#/components/schemas/entityTypes_ApprovalPolicyId'
      title: ApprovalPolicyUpdateRequest
    entityTypes_EntityId:
      type: string
      title: EntityId
    entityTypes_ApprovalPolicyResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/entityTypes_ApprovalPolicyId'
        trigger:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_Trigger'
        rule:
          $ref: '#/components/schemas/entityTypes_Rule'
        upstreamPolicyId:
          $ref: '#/components/schemas/entityTypes_ApprovalPolicyId'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - trigger
      - rule
      - upstreamPolicyId
      - createdAt
      - updatedAt
      title: ApprovalPolicyResponse
    entityTypes_ApprovalPolicyHistoryResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the approval policy history
        policies:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_ApprovalPolicyResponse'
