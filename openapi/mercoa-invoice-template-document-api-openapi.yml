components:
  schemas:
    emailLogTypes_EmailLog:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/emailLogTypes_EmailLogId'
        status:
          $ref: '#/components/schemas/emailLogTypes_IncomingEmailLogStatus'
          description: The status of the email log. If the status is PENDING, the email has not been processed yet. If the status is PROCESSED, the email has been processed and the invoice has been created. If the status is FAILED, the email was not processed due to an error.
        subject:
          type: string
        from:
          type: string
        to:
          type: string
        htmlBody:
          type: string
        textBody:
          type: string
        attachment:
          $ref: '#/components/schemas/emailLogTypes_EmailLogAttachment'
        createdAt:
          type: string
          format: date-time
        invoiceId:
          $ref: '#/components/schemas/invoiceTypes_InvoiceId'
      required:
      - id
      - status
      - subject
      - from
      - to
      - htmlBody
      - textBody
      - createdAt
      title: EmailLog
    emailLogTypes_IncomingEmailLogStatus:
      type: string
      enum:
      - PENDING
      - PROCESSED
      - FAILED
      title: IncomingEmailLogStatus
    emailLogTypes_EmailLogResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total number of logs for the given filters. This value is not limited by the limit parameter. It is provided so that you can determine how many pages of results are available.
        hasMore:
          type: boolean
          description: True if there are more logs available for the given filters.
        data:
          type: array
          items:
            $ref: '#/components/schemas/emailLogTypes_EmailLog'
      required:
      - count
      - hasMore
      - data
      title: EmailLogResponse
    commons_DocumentType:
      type: string
      enum:
      - INVOICE
      - PAYMENT_CONFIRMATION
      - TEN_NINETY_NINE
      - W9
      - CHECK
      - BANK_STATEMENT
      - CONTRACT
      - OTHER
      title: DocumentType
    commons_DocumentResponse:
      type: object
      properties:
        id:
          type: string
          description: ID of the document. If not provided, this is a dynamic document that is generated on the fly.
        mimeType:
          type: string
        type:
          $ref: '#/components/schemas/commons_DocumentType'
        uri:
          type: string
      required:
      - mimeType
      - type
      - uri
      title: DocumentResponse
    invoiceTypes_InvoiceTemplateId:
      type: string
      title: InvoiceTemplateId
    invoiceTypes_InvoiceId:
      type: string
      title: InvoiceId
    emailLogTypes_EmailLogId:
      type: string
      title: EmailLogId
    emailLogTypes_EmailLogAttachment:
      type: object
      properties:
        filename:
          type: string
        contentType:
          type: string
      required:
      - filename
      - contentType
      title: EmailLogAttachment
  securitySchemes:
    default:
      type: http
      scheme: bearer
