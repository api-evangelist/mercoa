  /invoice-template/{invoiceTemplateId}/check/generate:
    get:
      operationId: invoiceTemplate_document_generateCheckPdf
      summary: Get Check PDF
      description: Get a PDF of the check for the invoice. If the invoice does not have check as the disbursement method, an error will be returned. If the disbursement option for the check is set to 'MAIL', a void copy of the check will be returned. If the disbursement option for the check is set to 'PRINT', a printable check will be returned. If the invoice is NOT marked as PAID, the check will be a void copy.
      tags:
      - invoice-template > document
      parameters:
      - name: invoiceTemplateId
        in: path
        description: Invoice Template ID
        required: true
        schema:
          $ref: '#/components/schemas/invoiceTypes_InvoiceTemplateId'
