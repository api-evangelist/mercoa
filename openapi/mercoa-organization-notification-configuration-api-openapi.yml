components:
  schemas:
    organizationTypes_NotificationConfigurationRequest:
      oneOf:
      - type: object
        properties:
          notificationType:
            type: string
            enum:
            - invoice
            description: 'Discriminator value: invoice'
          url:
            type: string
            description: The URL that the email will link to.
          subject:
            type: string
            description: The subject of the email. If not provided, the default subject will be used.
        required:
        - notificationType
        - url
      discriminator:
        propertyName: notificationType
      title: NotificationConfigurationRequest
    organizationTypes_NotificationConfigurationResponse:
      oneOf:
      - type: object
        properties:
          notificationType:
            type: string
            enum:
            - invoice
            description: 'Discriminator value: invoice'
          url:
            type: string
            description: The URL that the email will link to.
          subject:
            type: string
            description: The subject of the email. If not provided, the default subject will be used.
          type:
            $ref: '#/components/schemas/entityTypes_NotificationType'
        required:
        - notificationType
        - url
        - type
      discriminator:
        propertyName: notificationType
      title: NotificationConfigurationResponse
    entityTypes_NotificationType:
      type: string
      enum:
      - INVOICE_APPROVAL_NEEDED
      - INVOICE_APPROVED
      - INVOICE_REJECTED
      - INVOICE_SCHEDULED
      - INVOICE_PENDING
      - INVOICE_PAID
      - INVOICE_CANCELED
      - INVOICE_CREATED
      - INVOICE_EMAILED
      - INVOICE_FAILED
      - COUNTERPARTY_ONBOARDING_COMPLETED
      title: NotificationType
  securitySchemes:
    default:
      type: http
      scheme: bearer
