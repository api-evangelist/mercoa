components:
  schemas:
    entityTypes_RepresentativeId:
      type: string
      title: RepresentativeId
    commons_Address:
      type: object
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        stateOrProvince:
          type: string
          description: State or province code. Must be in the format XX.
        postalCode:
          type: string
          description: Postal code. Must be in the format XXXXX or XXXXX-XXXX.
        country:
          type: string
      required:
      - addressLine1
      - city
      - stateOrProvince
      - postalCode
      title: Address
    entityTypes_RepresentativeRequest:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/commons_FullName'
        phone:
          $ref: '#/components/schemas/commons_PhoneNumber'
          description: Either phone or email is required.
        email:
          type: string
          description: Either phone or email is required.
        address:
          $ref: '#/components/schemas/commons_Address'
        birthDate:
          $ref: '#/components/schemas/commons_BirthDate'
        governmentID:
          $ref: '#/components/schemas/commons_IndividualGovernmentID'
        responsibilities:
          $ref: '#/components/schemas/entityTypes_Responsibilities'
      required:
      - name
      - address
      - birthDate
      - governmentID
      - responsibilities
      title: RepresentativeRequest
    entityTypes_RepresentativeResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/entityTypes_RepresentativeId'
        name:
          $ref: '#/components/schemas/commons_FullName'
        phone:
          $ref: '#/components/schemas/commons_PhoneNumber'
        email:
          type: string
        address:
          $ref: '#/components/schemas/commons_Address'
        birthDateProvided:
          type: boolean
        governmentIDProvided:
          type: boolean
        responsibilities:
          $ref: '#/components/schemas/entityTypes_Responsibilities'
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        disabledOn:
          type: string
          format: date-time
      required:
      - id
      - name
      - address
      - birthDateProvided
      - governmentIDProvided
      - responsibilities
      - createdOn
      - updatedOn
      title: RepresentativeResponse
    commons_IndividualGovernmentID:
      type: object
      properties:
        ssn:
          type: string
          description: Full Social Security Number. Must be in the format 123-45-6789.
      required:
      - ssn
      title: IndividualGovernmentID
    entityTypes_RepresentativeUpdateRequest:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/commons_FullName'
        phone:
          $ref: '#/components/schemas/commons_PhoneNumber'
        email:
          type: string
        address:
          $ref: '#/components/schemas/commons_Address'
        birthDate:
          $ref: '#/components/schemas/commons_BirthDate'
        governmentID:
          $ref: '#/components/schemas/commons_IndividualGovernmentID'
        responsibilities:
          $ref: '#/components/schemas/entityTypes_Responsibilities'
      title: RepresentativeUpdateRequest
    commons_PhoneNumber:
      type: object
      properties:
        countryCode:
          type: string
        number:
          type: string
      required:
      - countryCode
      - number
      title: PhoneNumber
    commons_BirthDate:
      type: object
      properties:
        day:
          type: string
        month:
          type: string
        year:
          type: string
      title: BirthDate
    commons_FullName:
      type: object
      properties:
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        suffix:
          type: string
      required:
      - firstName
      - lastName
      title: FullName
    entityTypes_EntityId:
      type: string
      title: EntityId
    entityTypes_Responsibilities:
      type: object
      properties:
        jobTitle:
          type: string
        isController:
          type: boolean
          description: Indicates whether this individual has significant management responsibilities within the business
        isOwner:
          type: boolean
          description: Indicates whether this individual has an ownership stake of at least 25% in the business
        ownershipPercentage:
          type: integer
          description: Percentage of ownership in the business. Must be between 0 and 100.
      title: Responsibilities
  securitySchemes:
    default:
      type: http
      scheme: bearer
