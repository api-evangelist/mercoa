components:
  schemas:
    invoiceTypes_ApprovalSlotId:
      type: string
      title: ApprovalSlotId
    entityTypes_EntityUserId:
      type: string
      title: EntityUserId
    invoiceTypes_ApprovalRequest:
      type: object
      properties:
        text:
          type: string
          description: Comment associated with this approval action.
        userId:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
          description: The ID or the Foreign ID of the user
      required:
      - userId
      title: ApprovalRequest
    invoiceTypes_AddApproverRequest:
      type: object
      properties:
        approvalSlotId:
          $ref: '#/components/schemas/invoiceTypes_ApprovalSlotId'
          description: The identifier for the approval slot this user is assigned to.
        userId:
          $ref: '#/components/schemas/entityTypes_EntityUserId'
          description: The ID or the Foreign ID of the user to add to the approval slot.
      required:
      - userId
      title: AddApproverRequest
    invoiceTypes_InvoiceId:
      type: string
      title: InvoiceId
  securitySchemes:
    default:
