components:
  schemas:
    entityTypes_EmailTemplateType:
      type: string
      enum:
      - PAYMENT
      - DISBURSEMENT
      title: EmailTemplateType
    entityTypes_EmailTemplateResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/entityTypes_EmailTemplateId'
        entityId:
          $ref: '#/components/schemas/entityTypes_EntityId'
          description: The ID of the entity that this email template is associated with.
        templateType:
          $ref: '#/components/schemas/entityTypes_EmailTemplateType'
        name:
          type: string
          description: The name of the email template.
        subject:
          type: string
          description: The subject of the email template.
        content:
          type: string
          description: The HTML content of the email template.
        isDefault:
          type: boolean
          description: True if this email template is the default template for new invoices.
      required:
      - id
      - entityId
      - templateType
      - name
      - subject
      - content
      - isDefault
      title: EmailTemplateResponse
    entityTypes_EmailTemplateId:
      type: string
      title: EmailTemplateId
    entityTypes_EntityId:
      type: string
      title: EntityId
    entityTypes_EmailTemplateRequest:
      type: object
      properties:
        templateType:
          $ref: '#/components/schemas/entityTypes_EmailTemplateType'
        name:
          type: string
          description: The name of the email template.
        subject:
          type: string
          description: The subject of the email template.
        content:
          type: string
          description: The HTML content of the email template.
        isDefault:
          type: boolean
          description: If true, this email template will be used as the default template for new invoices.
      required:
      - templateType
      - name
      - subject
      - content
      title: EmailTemplateRequest
  securitySchemes:
    default:
      type: http
      scheme: bearer
