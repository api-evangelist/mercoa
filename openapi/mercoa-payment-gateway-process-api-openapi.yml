    paymentGatewayTypes_EphemeralKeyEndpoint:
      type: object
      properties:
        url:
          type: string
          description: The URL endpoint to call for generating ephemeral keys
        method:
          type: string
          default: POST
          description: The HTTP method to use for the request
        headers:
          type: object
          additionalProperties:
            type: string
          description: The headers to include in the request. Supports variables {{cardId}}, {{nonce}}, and {{accountId}} that will be replaced with actual values.
        postBody:
          type: string
          description: The body to include in the POST request. Supports variables {{cardId}}, {{nonce}}, and {{accountId}} that will be replaced with actual values.
      required:
      - url
      - method
      - headers
      title: EphemeralKeyEndpoint
    paymentGatewayTypes_ProcessPaymentGatewayCardType:
      type: string
      enum:
      - credit
      - debit
      title: ProcessPaymentGatewayCardType
    paymentGatewayTypes_ProcessPaymentGatewayRequest:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - document
            description: 'Discriminator value: document'
          document:
            type: string
