openapi: 3.2.0
info:
  title: Reference Organization API
  version: 1.0.0
servers:
- url: https://api.mercoa.com
  description: Production
tags:
- name: Organization
paths:
  /organization:
    get:
      operationId: organization_get
      summary: Get
      description: Get current organization information
      tags:
      - Organization
      parameters:
      - name: paymentMethods
        in: query
        description: include supported payment methods in response
        required: false
        schema:
          type: boolean
      - name: emailProvider
        in: query
        description: include email provider info in response
        required: false
        schema:
          type: boolean
      - name: externalAccountingSystemProvider
        in: query
        description: include external accounting system provider info in response
        required: false
        schema:
          type: boolean
      - name: colorScheme
        in: query
        description: include color scheme info in response
        required: false
        schema:
          type: boolean
      - name: payeeOnboardingOptions
        in: query
        description: include payee onboarding options in response
        required: false
        schema:
          type: boolean
      - name: payorOnboardingOptions
        in: query
        description: include payor onboarding options in response
        required: false
        schema:
          type: boolean
      - name: metadataSchema
        in: query
        description: include metadata schema in response
        required: false
        schema:
          type: boolean
      - name: notificationEmailTemplate
        in: query
        description: include notification-email-template in response
        required: false
        schema:
          type: boolean
      - name: rolePermissions
        in: query
        description: include role permission config in response
        required: false
        schema:
          type: boolean
      - name: customDomains
        in: query
        description: include custom domains in response
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizationTypes_OrganizationResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      security:
      - default: []
    post:
      operationId: organization_update
      summary: Update
      description: Update current organization
      tags:
      - Organization
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizationTypes_OrganizationResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/organizationTypes_OrganizationRequest'
      security:
      - default: []
  /organization/emailLog:
    get:
      operationId: organization_emailLog
      summary: Email Log
      description: Get log of all emails sent to this organization. Content format subject to change.
      tags:
      - Organization
      parameters:
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: from
        in: query
        description: Filter by sender email address
        required: false
        schema:
          type: string
      - name: to
        in: query
        description: Filter by recipient email address
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of logs to return. Limit can range between 1 and 100, and the default is 10.
        required: false
        schema:
          type: integer
      - name: startingAfter
        in: query
        description: The ID of the log to start after. If not provided, the first page of logs will be returned.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/emailLogTypes_EmailLogResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      security:
      - default: []
  /organization/invalidateTokens:
    post:
      operationId: organization_invalidateTokens
      summary: Invalidate Tokens
      description: Invalidate all JWT tokens for the current organization. This is considered a break-glass action and should be used only if tokens have been compromised. All tokens will be invalidated, including tokens on links, emails, and currently logged in sessions. API keys are not affected by this action. This action may take 60 seconds to propagate.
      tags:
      - Organization
      responses:
        '200':
          description: Successful response
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: array
                  items:
                    type: string
                  description: Optional list of session IDs to invalidate. If not provided, all sessions will be invalidated.
      security:
      - default: []
components:
  schemas:
    emailLogTypes_IncomingEmailLogStatus:
      type: string
      enum:
      - PENDING
      - PROCESSED
      - FAILED
      title: IncomingEmailLogStatus
    organizationTypes_BusinessOnboardingOptionsResponse:
      type: object
      properties:
        termsOfService:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        email:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        name:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        address:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        phone:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        tenNinetyNine:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        w9:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        bankStatement:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        type:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        doingBusinessAs:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        ein:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        mcc:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        formationDate:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        website:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        description:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        representatives:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        logo:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        averageTransactionSize:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        averageMonthlyTransactionVolume:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
        maxTransactionSize:
          $ref: '#/components/schemas/organizationTypes_OnboardingOptionResponse'
      required:
      - termsOfService
      - email
      - name
      - address
      - phone
      - tenNinetyNine
      - w9
      - bankStatement
      - type
      - doingBusinessAs
      - ein
      - mcc
      - formationDate
      - website
      - description
      - representatives
      - logo
      - averageTransactionSize
      - averageMonthlyTransactionVolume
      - maxTransactionSize
      title: BusinessOnboardingOptionsResponse
    organizationTypes_PaymentRailResponse:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - bankAccount
            description: 'Discriminator value: bankAccount'
          name:
            type: string
            description: unused
            deprecated: true
          active:
            type: boolean
          availableDeliveryMethods:
            type: array
            items:
              $ref: '#/components/schemas/invoiceTypes_BankDeliveryMethod'
          defaultDeliveryMethod:
            $ref: '#/components/schemas/invoiceTypes_BankDeliveryMethod'
        required:
        - type
        - name
        - active
        - availableDeliveryMethods
        - defaultDeliveryMethod
      - type: object
        properties:
          type:
            type: string
            enum:
            - card
            description: 'Discriminator value: card'
          name:
            type: string
            description: unused
            deprecated: true
          active:
            type: boolean
        required:
        - type
        - name
        - active
      - type: object
        properties:
          type:
            type: string
            enum:
            - virtualCard
            description: 'Discriminator value: virtualCard'
          name:
            type: string
            description: unused
            deprecated: true
          active:
            type: boolean
        required:
        - type
        - name
        - active
      - type: object
        properties:
          type:
            type: string
            enum:
            - check
            description: 'Discriminator value: check'
          name:
            type: string
            description: unused
            deprecated: true
          active:
            type: boolean
          availableDeliveryMethods:
            type: array
            items:
              $ref: '#/components/schemas/invoiceTypes_CheckDeliveryMethod'
          defaultDeliveryMethod:
            $ref: '#/components/schemas/invoiceTypes_CheckDeliveryMethod'
          printDescription:
            type: boolean
        required:
        - type
        - name
        - active
        - availableDeliveryMethods
        - defaultDeliveryMethod
        - printDescription
      - type: object
        properties:
          type:
            type: string
            enum:
            - custom
            description: 'Discriminator value: custom'
          name:
            type: string
            description: unused
            deprecated: true
          active:
            type: boolean
          schemaId:
            type: string
        required:
        - type
        - name
        - active
        - schemaId
      - type: object
        properties:
          type:
            type: string
            enum:
            - bnpl
            description: 'Discriminator value: bnpl'
          name:
            type: string
            description: unused
            deprecated: true
          active:
            type: boolean
        required:
        - type
        - name
        - active
      - type: object
        properties:
          type:
            type: string
            enum:
            - offPlatform
            description: 'Discriminator value: offPlatform'
          name:
            type: string
            description: unused
            deprecated: true
          active:
            type: boolean
        required:
        - type
        - name
        - active
      - type: object
        properties:
          type:
            type: string
            enum:
            - utility
            description: 'Discriminator value: utility'
          name:
            type: string
            description: unused
            deprecated: true
          active:
            type: boolean
        required:
        - type
        - name
        - active
      - type: object
        properties:
          type:
            type: string
            enum:
            - na
            description: 'Discriminator value: na'
          name:
            type: string
            description: unused
            deprecated: true
          active:
            type: boolean
        required:
        - type
        - name
        - active
      - type: object
        properties:
          type:
            type: string
            enum:
            - wallet
            description: 'Discriminator value: wallet'
          name:
            type: string
            description: unused
            deprecated: true
          active:
            type: boolean
        required:
        - type
        - name
        - active
      discriminator:
        propertyName: type
      title: PaymentRailResponse
    organizationTypes_EmailProviderRequest:
      type: object
      properties:
        sender:
          $ref: '#/components/schemas/organizationTypes_EmailSenderRequest'
        inboxDomain:
          type: string
        alternativeInboxDomains:
          type: array
          items:
            type: string
      required:
      - sender
      - inboxDomain
      title: EmailProviderRequest
    organizationTypes_ColorSchemeRequest:
      type: object
      properties:
        primaryColor:
          type: string
        secondaryColor:
          type: string
        logoBackgroundColor:
          type: string
        roundedCorners:
          type: integer
        fontFamily:
          type: string
        fontSize:
          type: string
      title: ColorSchemeRequest
    organizationTypes_PaymentMethodsRequest:
      type: object
      properties:
        payerPayments:
          type: array
          items:
            $ref: '#/components/schemas/organizationTypes_PaymentRailRequest'
          description: List of payment methods that can be used to pay invoices.
        backupDisbursements:
          type: array
          items:
            $ref: '#/components/schemas/organizationTypes_PaymentRailRequest'
          description: List of payment methods that can be created by a payor to send disbursements.
        vendorDisbursements:
          type: array
          items:
            $ref: '#/components/schemas/organizationTypes_PaymentRailRequest'
          description: List of payment methods that can be created by a payee to receive disbursements.
      required:
      - payerPayments
      - backupDisbursements
      - vendorDisbursements
      title: PaymentMethodsRequest
    entityTypes_EntityId:
      type: string
      title: EntityId
    emailLogTypes_EmailLog:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/emailLogTypes_EmailLogId'
        status:
          $ref: '#/components/schemas/emailLogTypes_IncomingEmailLogStatus'
          description: The status of the email log. If the status is PENDING, the email has not been processed yet. If the status is PROCESSED, the email has been processed and the invoice has been created. If the status is FAILED, the email was not processed due to an error.
        subject:
          type: string
        from:
          type: string
        to:
          type: string
        htmlBody:
          type: string
        textBody:
          type: string
        attachment:
          $ref: '#/components/schemas/emailLogTypes_EmailLogAttachment'
        createdAt:
          type: string
          format: date-time
        invoiceId:
          $ref: '#/components/schemas/invoiceTypes_InvoiceId'
      required:
      - id
      - status
      - subject
      - from
      - to
      - htmlBody
      - textBody
      - createdAt
      title: EmailLog
    invoiceTypes_InvoiceId:
      type: string
      title: InvoiceId
