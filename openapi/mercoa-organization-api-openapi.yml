          name:
            type: string
            deprecated: true
          active:
            type: boolean
        required:
        - type
        - active
      - type: object
        properties:
          type:
            type: string
            enum:
            - offPlatform
            description: 'Discriminator value: offPlatform'
          name:
            type: string
            deprecated: true
          active:
            type: boolean
        required:
        - type
        - active
      - type: object
        properties:
          type:
            type: string
            enum:
            - utility
            description: 'Discriminator value: utility'
          name:
            type: string
            deprecated: true
          active:
            type: boolean
        required:
