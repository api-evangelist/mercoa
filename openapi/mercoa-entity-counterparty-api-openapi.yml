openapi: 3.2.0
info:
  title: Reference entity > counterparty API
  version: 1.0.0
servers:
- url: https://api.mercoa.com
  description: Production
tags:
- name: entity > counterparty
paths:
  /entity/{entityId}/counterparties/payees:
    get:
      operationId: entity_counterparty_findPayees
      summary: Find payee counterparties
      description: Find payee counterparties. This endpoint lets you find vendors linked to the entity.
      tags:
      - entity > counterparty
      parameters:
      - name: entityId
        in: path
        description: Entity ID or Entity ForeignID
        required: true
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: name
        in: query
        description: Use search instead. Deprecated. Filter counterparties by name. Partial matches are supported.
        required: false
        schema:
          type: string
        deprecated: true
      - name: search
        in: query
        description: Filter counterparties by name or email. Partial matches are supported.
        required: false
        schema:
          type: string
      - name: networkType
        in: query
        description: Filter by network type. By default, only ENTITY counterparties are returned.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_CounterpartyNetworkType'
      - name: paymentMethods
        in: query
        description: If true, will include counterparty payment methods as part of the response
        required: false
        schema:
          type: boolean
      - name: invoiceMetrics
        in: query
        description: If true, will include counterparty invoice metrics as part of the response
        required: false
        schema:
          type: boolean
      - name: counterpartyId
        in: query
        description: Filter by counterparty ids (Foreign ID is supported)
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      - name: metadata
        in: query
        description: Filter counterparties by simple key/value metadata. Each filter will be applied as an AND condition. Duplicate keys will be ignored.
        required: false
        schema:
          $ref: '#/components/schemas/invoiceTypes_MetadataFilter'
      - name: returnMetadata
        in: query
        description: If true, will return simple key/value metadata for the counterparties. For more complex metadata, use the Metadata API.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of counterparties to return. Limit can range between 1 and 100, and the default is 10.
        required: false
        schema:
          type: integer
      - name: startingAfter
        in: query
        description: The ID of the counterparties to start after. If not provided, the first page of counterparties will be returned.
        required: false
        schema:
          $ref: '#/components/schemas/entityTypes_EntityId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entityTypes_FindCounterpartiesResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequest
                  content:
                    type: string
                required:
                - errorName
                - content
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unauthorized
                  content:
                    type: string
                required:
                - errorName
                - content
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Forbidden
                  content:
                    type: string
                required:
                - errorName
                - content
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFound
                  content:
                    type: string
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Conflict
                  content:
                    type: string
                required:
                - errorName
                - content
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - InternalServerError
                  content:
                    type: string
                required:
                - errorName
                - content
        '501':
          description: Error response with status 501
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - Unimplemented
                  content:
                    type: string
                required:
                - errorName
                - content
      security:
      - default: []
