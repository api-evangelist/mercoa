components:
  schemas:
    entityTypes_EntityHidePayorsRequest:
      type: object
      properties:
        payors:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityId'
          description: List of payor entity IDs or foreign IDs to hide
      required:
      - payors
      title: EntityHidePayorsRequest
    entityTypes_CounterpartyNetworkType:
      type: string
      enum:
      - ENTITY
      - NETWORK
      title: CounterpartyNetworkType
    entityTypes_TaxID:
      type: object
      properties:
        ein:
          $ref: '#/components/schemas/entityTypes_Ein'
      required:
      - ein
      title: TaxID
    paymentMethodTypes_CustomPaymentMethodSchemaField:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        type:
          $ref: '#/components/schemas/paymentMethodTypes_CustomPaymentMethodSchemaFieldType'
        optional:
          type: boolean
          description: Indicates whether this field is optional
        useAsAccountName:
          type: boolean
          description: Indicates whether this field should be used as the name of the payment method. Only one field can be used as the name. Will set the accountName field of the payment method to the value of this field.
        useAsAccountNumber:
          type: boolean
          description: Indicates whether this field should be used as the account number of the payment method. Only one field can be used as the account number. Will set the accountNumber field of the payment method to the value of this field.
        options:
          type: array
          items:
            type: string
          description: When type is 'select', provide options that can be selected
      required:
      - name
      - type
      - optional
      title: CustomPaymentMethodSchemaField
    paymentMethodTypes_CardType:
      type: string
      enum:
      - credit
      - debit
      - prepaid
      - unknown
      title: CardType
    paymentMethodTypes_CardBrand:
      type: string
      enum:
      - AmericanExpress
      - Discover
      - Mastercard
      - Visa
      title: CardBrand
    entityTypes_IndividualProfileResponse:
      type: object
      properties:
        email:
          type: string
        name:
          $ref: '#/components/schemas/commons_FullName'
        phone:
          $ref: '#/components/schemas/commons_PhoneNumber'
        address:
          $ref: '#/components/schemas/commons_Address'
        birthDateProvided:
          type: boolean
        governmentIDProvided:
          type: boolean
      required:
      - name
      - birthDateProvided
      - governmentIDProvided
      title: IndividualProfileResponse
    paymentMethodTypes_BankStatus:
      type: string
      enum:
      - NEW
      - VERIFIED
      - VERIFICATION_FAILED
      - PENDING
      - ERRORED
      title: BankStatus
    entityTypes_CounterpartyCustomizationAccount:
      type: object
      properties:
        accountId:
          type: string
          description: The ID the counterparty has assigned to this account.
        postalCode:
          type: string
          description: The postal code the counterparty has assigned to this account.
        nameOnAccount:
          type: string
          description: The name on the account the counterparty has assigned to this account.
      required:
      - accountId
      title: CounterpartyCustomizationAccount
    entityTypes_EntityId:
      type: string
      title: EntityId
    entityTypes_EntityAddPayeesRequest:
      type: object
      properties:
        payees:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_EntityId'
          description: List of payee entity IDs or foreign IDs to associate with the entity
        customizations:
          type: array
          items:
            $ref: '#/components/schemas/entityTypes_CounterpartyCustomizationRequest'
          description: List of customizations to apply to the payees. If the payee is not currently a counterparty of the entity, the counterparty will be created with the provided customizations.
      required:
      - payees
      title: EntityAddPayeesRequest
    paymentMethodTypes_WalletBalance:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: The amount in major units of the currency.
        currency:
          $ref: '#/components/schemas/paymentMethodTypes_CurrencyCode'
      required:
      - amount
      - currency
      title: WalletBalance
    invoiceTypes_MetadataFilter:
      type: object
      properties:
        key:
          type: string
        value:
          $ref: '#/components/schemas/commons_StringOrStringArray'
          description: If multiple values are provided, the filter will match if any of the values match (OR filter). To filter for the absence of a key, use the value 'NULL'. To filter for the presence of a key, use the value 'NOT NULL'.
      required:
      - key
      - value
      title: MetadataFilter
    entityTypes_BusinessProfileResponse:
      type: object
      properties:
        email:
          type: string
        legalBusinessName:
          type: string
        businessType:
          $ref: '#/components/schemas/entityTypes_BusinessType'
        phone:
          $ref: '#/components/schemas/commons_PhoneNumber'
        doingBusinessAs:
          type: string
        website:
          type: string
        description:
          type: string
        address:
          $ref: '#/components/schemas/commons_Address'
        ownersProvided:
          type: boolean
          description: True if all representatives have been provided for this business.
        taxIDProvided:
          type: boolean
        taxId:
          $ref: '#/components/schemas/entityTypes_TaxID'
        formationDate:
          type: string
